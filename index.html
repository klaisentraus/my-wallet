function paqueteJSON(){
  var copia=JSON.parse(JSON.stringify(S));
  Object.keys(copia).forEach(function(k){ if(k.charAt(0)==='_') delete copia[k]; });
  copia.exportado=new Date().toISOString();
  return JSON.stringify(copia);
}
function nombreArchivo(ext){
  var d=new Date();
  return 'MyWallet-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.'+ext;
}
function marcarRespaldo(){
  S.ajustes.ultimoRespaldo=new Date().toISOString();
  S.ajustes.movsDesdeRespaldo=0; guardar(); pintar();
}
function bajar(txt, nombre, tipo){
  try{
    var b=new Blob([txt],{type:tipo||'application/json'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },1200);
    return true;
  }catch(e){ return false; }
}
function respaldarArchivo(){
  if(bajar(paqueteJSON(), nombreArchivo('json'))){ marcarRespaldo(); toast('Cópia baixada ✓'); }
  else toast('Não deu para baixar. Use «Copiar».');
}
function respaldarCompartir(){
  var txt=paqueteJSON();
  var hecho=false;
  try{
    var f=new File([txt], nombreArchivo('json'), {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f], title:'Cópia do My Wallet'})
        .then(function(){ marcarRespaldo(); toast('Cópia enviada ✓'); })
        .catch(function(){});
      hecho=true;
    }
  }catch(e){}
  if(!hecho && navigator.share){
    navigator.share({title:'Cópia do My Wallet', text:txt})
      .then(function(){ marcarRespaldo(); toast('Cópia enviada ✓'); })
      .catch(function(){});
    hecho=true;
  }
  if(!hecho){
    respaldarCopiar();
    toast('Copiado. Cole num chat com você mesmo.');
  }
}
function respaldarCopiar(){
  var txt=paqueteJSON();
  function ok(){ marcarRespaldo(); toast('Cópia na área de transferência ✓'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){ copiarViejo(txt,ok); });
  }else copiarViejo(txt,ok);
}
function copiarViejo(txt,ok){
  var t=document.createElement('textarea'); t.value=txt;
  t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t);
  t.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ toast('Não deu para copiar'); }
  document.body.removeChild(t);
}
function exportarApp(){
  var abre='<script id="seed" type="application/json">';
  var i=HTML_ORIGINAL.indexOf(abre);
  if(i<0){ toast('Não deu para gerar o arquivo'); return; }
  var j=HTML_ORIGINAL.indexOf('<'+'/script>', i);
  if(j<0){ toast('Não deu para gerar o arquivo'); return; }
  var datos=paqueteJSON().replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  var html='<!doctype html>\n'+HTML_ORIGINAL.slice(0,i+abre.length)+datos+HTML_ORIGINAL.slice(j);
  if(bajar(html, nombreArchivo('html'), 'text/html')){
    marcarRespaldo();
    toast('Pronto. Guarde no Drive ou mande para você.');
  }else toast('Não deu para baixar o arquivo');
}
function aplicarRestaurado(o){
  if(!o || Object.prototype.toString.call(o.mov)!=='[object Array]'){ toast('Esse arquivo não parece uma cópia válida'); return; }
  if(!o.mov.length && !confirm('Essa cópia não tem movimentos. Restaurar mesmo assim?')) return;
  if(S.mov.length && !confirm('Você vai substituir '+S.mov.length+' movimento(s) deste aparelho por '+o.mov.length+' da cópia. Continuar?')) return;
  var base=estadoNuevo();
  S={ v:1, updatedAt:new Date().toISOString(),
      perfil:Object.assign(base.perfil, o.perfil||{}),
      mov:o.mov||[], metas:o.metas||[], deudas:o.deudas||[], fijos:o.fijos||[],
      cobros:o.cobros||[],
      ajustes:Object.assign(base.ajustes, o.ajustes||{}) };
  guardar(); aplicarTema(); ir('inicio');
  toast('Dados restaurados ✓ ('+S.mov.length+' movimentos)');
}
function restaurarArchivo(inp){
  var f=inp.files && inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ aplicarRestaurado(JSON.parse(String(r.result))); }
    catch(e){ toast('Não consegui ler esse arquivo'); }
    inp.value='';
  };
  r.onerror=function(){ toast('Não consegui ler esse arquivo'); };
  r.readAsText(f);
}
function restaurarTexto(){
  var t=(document.getElementById('pegaTxt')||{}).value||'';
  if(!t.trim()){ toast('Cole primeiro o texto da cópia'); return; }
  try{ aplicarRestaurado(JSON.parse(t.trim())); }
  catch(e){ toast('Esse texto não é uma cópia válida'); }
}
function borrarTodo(){
  if(!confirm('Tem certeza? Apaga tudo o que você registrou neste aparelho.')) return;
  if(!confirm('Última confirmação. Você tem uma cópia guardada? Isto não dá para desfazer.')) return;
  S=estadoNuevo(); guardar(); ir('inicio'); toast('Tudo apagado');
}

/* =========================================================================
   SHEETS — agregar / editar
   ========================================================================= */
function sheet(titulo, html){
  document.getElementById('sheetBody').innerHTML =
    (titulo?'<h2 style="margin-bottom:14px">'+esc(titulo)+'</h2>':'')+html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.body.style.overflow='hidden';
}
/* la barrita de arriba: un toque cierra, y también se puede arrastrar la ficha hacia abajo */
var ARR={activo:false, y0:0, t0:0, dy:0};
function arrIni(y){
  ARR.activo=true; ARR.y0=y; ARR.t0=Date.now(); ARR.dy=0;
  document.getElementById('sheet').style.transition='none';
}
function arrMueve(y){
  if(!ARR.activo) return;
  ARR.dy=Math.max(0, y-ARR.y0);
  document.getElementById('sheet').style.transform='translateY('+ARR.dy+'px)';
}
function arrFin(){
  if(!ARR.activo) return;
  ARR.activo=false;
  var sh=document.getElementById('sheet');
  sh.style.transition=''; sh.style.transform='';
  /* un toque cierra; un arrastre cierra si bajó bastante o si fue un tirón rápido */
  var tiron=(Date.now()-ARR.t0)<300 && ARR.dy>24;
  if(ARR.dy<6 || ARR.dy>90 || tiron) cerrarSheet();
}
function montarArrastre(){
  var cab=document.getElementById('sheetCab'); if(!cab) return;
  cab.addEventListener('touchstart', function(e){ arrIni(e.touches[0].clientY); }, {passive:true});
  cab.addEventListener('touchmove', function(e){
    arrMueve(e.touches[0].clientY); if(e.cancelable) e.preventDefault();
  }, {passive:false});
  cab.addEventListener('touchend', arrFin);
  cab.addEventListener('touchcancel', arrFin);
  cab.addEventListener('mousedown', function(e){ arrIni(e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', function(e){ if(ARR.activo) arrMueve(e.clientY); });
  window.addEventListener('mouseup', function(){ if(ARR.activo) arrFin(); });
  cab.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' ') { e.preventDefault(); cerrarSheet(); }
  });
}

function cerrarSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  document.body.style.overflow='';
}

var ADD={tipo:'out', monto:'', cat:'mercado', destino:'colchon', fecha:hoyISO(), nota:'', id:null,
         retiro:false, ref:null, refMes:null};

function abrirAdd(tipo, mov){
  if(mov){
    ADD={tipo:mov.tipo, monto:String(Math.abs(mov.monto)), cat:mov.cat, destino:mov.destino||'colchon',
         fecha:mov.fecha, nota:mov.nota||'', id:mov.id, retiro:mov.monto<0,
         ref:mov.ref||null, refMes:mov.refMes||null, refNombre:mov.nota||''};
  }else{
    ADD={tipo:tipo||'out', monto:'', cat:(tipo==='in'?'salario':'mercado'), destino:'colchon',
         fecha:hoyISO(), nota:'', id:null, retiro:false, ref:null, refMes:null};
  }
  renderAdd();
}
function renderAdd(){
  var v = ADD.monto ? fmtNum(+ADD.monto) : '0,00';
  var h='';
  if(ADD.ref){
    h += '<div class="banner ok" style="margin-bottom:12px"><span class="e">\ud83d\udcc5</span><div>'+
      '<b>Pagando: '+esc(ADD.refNombre||'')+'</b><br>Ajuste o valor se você pagou outra coisa.</div></div>';
  }
  h += '<div class="seg">'+
    [['out','Gasto'],['in','Entrada'],['save','Guardar']].map(function(t){
      return '<button data-t="'+t[0]+'" class="'+(ADD.tipo===t[0]?'on':'')+'" onclick="cambiarTipo(\''+t[0]+'\')">'+t[1]+'</button>';
    }).join('')+'</div>';

  h += '<div class="amount"><div class="v tnum'+(ADD.monto?'':' zero')+'">R$ '+v+'</div></div>';

  h += '<div class="pad">'+
    [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button onclick="tecla(\''+n+'\')">'+n+'</button>'; }).join('')+
    '<button class="sec" onclick="tecla(\'00\')">00</button>'+
    '<button onclick="tecla(\'0\')">0</button>'+
    '<button class="sec" onclick="tecla(\'del\')">⌫</button>'+
  '</div>';

  if(ADD.tipo==='save'){
    var destinos=[{id:'colchon',n:'Reserva',e:'🛟'}].concat(S.metas.map(function(m){ return {id:m.id,n:m.nombre,e:m.emoji||'🎯'}; }));
    h += '<label class="f">Para onde vai?</label><div class="catgrid">'+
      destinos.map(function(d){
        return '<button class="'+(ADD.destino===d.id?'on':'')+'" onclick="ADD.destino=\''+d.id+'\';renderAdd()">'+
          '<span class="e">'+d.e+'</span>'+esc(d.n)+'</button>'; }).join('')+
      '</div>'+
      '<label class="f" style="display:flex;align-items:center;gap:9px;margin-top:14px">'+
      '<input type="checkbox" '+(ADD.retiro?'checked':'')+' onchange="ADD.retiro=this.checked" style="width:19px;height:19px;accent-color:var(--accent)">'+
      '<span style="font-size:13.5px;color:var(--text);font-weight:500">Ao contrário: tirei dinheiro do que estava guardado</span></label>';
  }else{
    var lista=CATS[ADD.tipo];
    h += '<label class="f">Categoria</label><div class="catgrid">'+
      lista.map(function(c){
        return '<button class="'+(ADD.cat===c.id?'on':'')+'" onclick="ADD.cat=\''+c.id+'\';renderAdd()">'+
          '<span class="e">'+c.e+'</span>'+esc(c.n)+'</button>'; }).join('')+'</div>';
  }

  h += '<label class="f">Data</label><input class="f" type="date" value="'+ADD.fecha+'" onchange="ADD.fecha=this.value">';
  h += '<label class="f">Nota (opcional)</label><input class="f" placeholder="Ex: mercado do mês" value="'+esc(ADD.nota)+'" oninput="ADD.nota=this.value">';

  h += '<button class="btn mt20" onclick="guardarMov()">'+(ADD.id?'Salvar alterações':'Pronto')+'</button>';
  if(ADD.id) h += '<button class="btn ghost mt12" style="color:var(--danger)" onclick="borrarMov(\''+ADD.id+'\')">Apagar</button>';

  sheet(ADD.id?'Editar movimento':null, h);
}
function cambiarTipo(t){
  ADD.tipo=t;
  /* un ingreso o un ahorro ya no es el pago de esa cuota: se suelta el vinculo */
  if(t!=='out'){ ADD.ref=null; ADD.refMes=null; ADD.refNombre=''; }
  if(t==='out' && !CAT_MAP[ADD.cat]) ADD.cat='mercado';
  if(t==='in' && CATS.in.filter(function(c){return c.id===ADD.cat;}).length===0) ADD.cat='salario';
  if(t==='out' && CATS.out.filter(function(c){return c.id===ADD.cat;}).length===0) ADD.cat='mercado';
  renderAdd();
}
function tecla(k){
  if(k==='del') ADD.monto=ADD.monto.slice(0,-1);
  else if(k==='00'){ if(ADD.monto) ADD.monto=(ADD.monto+'00').slice(0,12); }
  else ADD.monto=(ADD.monto+k).replace(/^0+/,'').slice(0,12);
  var el=document.querySelector('.amount .v');
  if(el){ el.textContent='R$ '+(ADD.monto?fmtNum(+ADD.monto):'0,00'); el.classList.toggle('zero',!ADD.monto); }
}
function guardarMov(){
  var m=+ADD.monto||0;
  if(m<=0){ toast('Digite um valor'); return; }
  if(ADD.tipo==='save' && ADD.retiro) m=-m;
  if(ADD.id){
    S.mov.forEach(function(x){
      if(x.id===ADD.id){
        if(x.ref) ajustarDeuda(x.ref, +(x.ab||0));            /* revierte el abono anterior */
        x.tipo=ADD.tipo; x.monto=m; x.cat=ADD.cat; x.destino=ADD.destino; x.fecha=ADD.fecha; x.nota=ADD.nota.trim();
        if(x.ref){
          x.ab = x.saldada ? Math.max(0, (deudaDe(x.ref)||{}).saldo||0) : abonoDe(x.ref,m);
          ajustarDeuda(x.ref, -x.ab);
        }
      }
    });
    toast('Alterações salvas ✓');
  }else{
    var nm={id:uid(), tipo:ADD.tipo, monto:m, cat:ADD.cat, destino:ADD.destino,
            fecha:ADD.fecha, nota:ADD.nota.trim(), creado:new Date().toISOString()};
    if(ADD.refc){ nm.refc=ADD.refc; nm.refcMes=ADD.refcMes; }
    if(ADD.ref){
      nm.ref=ADD.ref; nm.refMes=ADD.refMes;
      /* si la está soltando entera, la deuda se cierra completa aunque pague menos:
         la diferencia es el descuento por pagar todo de una */
      if(ADD.saldar){
        nm.saldada=true;
        nm.ab=Math.max(0, (deudaDe(ADD.ref)||{}).saldo||0);
      }else nm.ab=abonoDe(ADD.ref,m);
      ajustarDeuda(ADD.ref, -nm.ab);
    }
    S.mov.push(nm);
    S.ajustes.movsDesdeRespaldo=(S.ajustes.movsDesdeRespaldo||0)+1;
    toast(ADD.ref ? 'Pagamento registrado ✓'
        : (ADD.tipo==='in'?'Entrada registrada ✓':(ADD.tipo==='save'?'Boa! Guardado 🐾':'Gasto registrado ✓')));
    /* el gato reacciona a lo que ella acaba de hacer */
    if(ADD.tipo==='save') petForzar('happy', 3000);
    else if(ADD.ref) petForzar('excited', 2400);
  }
  cerrarSheet(); pintarTodo();
}
function editarMov(id){
  var m=S.mov.filter(function(x){ return x.id===id; })[0]; if(!m) return;
  abrirAdd(null,m);
}
function borrarMov(id){
  if(!confirm('Apagar este movimento?')) return;
  var vm=S.mov.filter(function(x){ return x.id===id; })[0];
  if(vm && vm.ref) ajustarDeuda(vm.ref, +(vm.ab||0));
  S.mov=S.mov.filter(function(x){ return x.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Apagado');
}

/* =========================================================================
   PAGOS CON FECHA — cuotas de deuda y gastos fijos que vencen
   ========================================================================= */
function fechaDe(ym,dia){ return ym+'-'+pad(Math.min(Math.max(1,dia||1), diasEnMes(ym))); }
/* el mes en que cae la cuota k de una deuda a plazos (k=0 es la primera) */
function mesCuota(desde, k){
  var y=+desde.slice(0,4), m=+desde.slice(5,7)-1+k;
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  return y+'-'+pad(m+1);
}
/* cuántas cuotas lleva pagadas y cuál sigue (-1 si ya no queda ninguna) */
function estadoCuotas(d){
  var pagadas=0, sig=-1;
  for(var k=0;k<(d.n||0);k++){
    if(pagoDe(d.id, mesCuota(d.fecha,k))) pagadas++;
    else if(sig<0) sig=k;
  }
  return {pagadas:pagadas, sig:sig};
}
function deudaDe(id){ return S.deudas.filter(function(d){ return d.id===id; })[0]; }

/* el movimiento que salda ese compromiso en ese mes, si existe */
function pagoDe(id,ym){
  var r=null;
  S.mov.forEach(function(m){ if(m.ref===id && m.refMes===ym) r=m; });
  return r;
}

function compromisos(ym){
  var hoyD=new Date().getDate(), esActual=(ym===ymHoy()), out=[];

  function agregar(o, tipoComp, cat, monto){
    if(!(monto>0)) return;
    if(o.tipo==='unica'){
      if(!o.fecha) return;
      var mesF=o.fecha.slice(0,7);
      /* aparece en su mes; y si ya pasó y sigue sin pagar, se arrastra al mes
         actual para que no se le olvide */
      if(mesF!==ym && !(esActual && mesF<ym && !pagoDe(o.id,mesF))) return;
      out.push({id:o.id, nombre:o.nombre, monto:monto, tipo:tipoComp, cat:cat,
                unica:true, fecha:o.fecha, mesRef:mesF, dia:+o.fecha.slice(8,10)});
    }else{
      if(!(o.dia>0)) return;
      out.push({id:o.id, nombre:o.nombre, monto:monto, tipo:tipoComp, cat:cat,
                unica:false, fecha:fechaDe(ym,o.dia), mesRef:ym, dia:o.dia});
    }
  }
  S.deudas.forEach(function(d){
    if((d.saldo||0)<=0) return;             /* ya está pagada: no vuelve a pedir plata */
    if(d.tipo==='cuotas'){
      if(!d.fecha || !(d.n>0)) return;
      var dia=+d.fecha.slice(8,10);
      for(var k=0;k<d.n;k++){
        var mes=mesCuota(d.fecha,k);
        /* cada cuota vive en su mes; si se pasó y sigue sin pagar, se arrastra
           al mes actual para que no se le pierda */
        if(mes!==ym && !(esActual && mes<ym && !pagoDe(d.id,mes))) continue;
        var mo=Math.min(d.cuota||0, d.saldo||0);
        if(!(mo>0)) continue;
        out.push({id:d.id, nombre:d.nombre, monto:mo, tipo:'deuda', cat:'deudas',
                  unica:false, cuotaN:k+1, cuotasTot:d.n,
                  fecha:fechaDe(mes,dia), mesRef:mes, dia:dia});
      }
      return;
    }
    /* pago único: lo que debe pagar es todo lo que debe; así se ajusta solo
       después de un abono parcial */
    agregar(d,'deuda','deudas', d.tipo==='unica' ? (d.saldo||0) : (d.cuota||0));
  });
  S.fijos.forEach(function(f){ agregar(f,'fijo',f.cat||'otros_out',f.monto); });

  var hoy0=new Date(); hoy0.setHours(0,0,0,0);
  out.forEach(function(c){
    var mv=pagoDe(c.id,c.mesRef);
    c.pagado=!!mv; c.mov=mv;
    var p=c.fecha.split('-');
    c.dias=Math.round((new Date(+p[0],+p[1]-1,+p[2]) - hoy0)/86400000);
    if(c.pagado)            c.estado='pagado';
    else if(c.mesRef<ymHoy()) c.estado='vencido';
    else if(c.mesRef>ymHoy()) c.estado='futuro';
    else if(c.dias<0)       c.estado='vencido';
    else if(c.dias<=5)      c.estado='proximo';
    else                    c.estado='pendiente';
  });
  out.sort(function(a,b){ return (a.pagado?1:0)-(b.pagado?1:0) || a.fecha.localeCompare(b.fecha); });
  return out;
}

/* el movimiento que registra ese cobro en ese mes, si existe */
function cobroDe(id, ym){
  var r=null;
  S.mov.forEach(function(m){ if(m.refc===id && m.refcMes===ym) r=m; });
  return r;
}
/* lo que espera recibir en ese mes: sueldos, trabajos, y lo que le deben */
function cobrosDe(ym){
  var esActual=(ym===ymHoy()), out=[], hoy0=new Date(); hoy0.setHours(0,0,0,0);
  S.cobros.forEach(function(c){
    if(!(c.monto>0)) return;
    if(c.tipo==='unica'){
      if(!c.fecha) return;
      var mesF=c.fecha.slice(0,7);
      /* si ya pasó la fecha y no ha entrado, se arrastra: es plata que le deben */
      if(mesF!==ym && !(esActual && mesF<ym && !cobroDe(c.id,mesF))) return;
      out.push({id:c.id, nombre:c.nombre, monto:c.monto, dequien:c.dequien||'',
                unica:true, fecha:c.fecha, mesRef:mesF, dia:+c.fecha.slice(8,10)});
    }else{
      if(!(c.dia>0)) return;
      out.push({id:c.id, nombre:c.nombre, monto:c.monto, dequien:c.dequien||'',
                unica:false, fecha:fechaDe(ym,c.dia), mesRef:ym, dia:c.dia});
    }
  });
  out.forEach(function(c){
    var mv=cobroDe(c.id, c.mesRef);
    c.recibido=!!mv; c.mov=mv;
    var p=c.fecha.split('-');
    c.dias=Math.round((new Date(+p[0],+p[1]-1,+p[2]) - hoy0)/86400000);
    if(c.recibido)              c.estado='recibido';
    else if(c.mesRef<ymHoy())   c.estado='atrasado';
    else if(c.mesRef>ymHoy())   c.estado='futuro';
    else if(c.dias<0)           c.estado='atrasado';
    else if(c.dias<=5)          c.estado='proximo';
    else                        c.estado='pendiente';
  });
  out.sort(function(a,b){ return (a.recibido?1:0)-(b.recibido?1:0) || a.fecha.localeCompare(b.fecha); });
  return out;
}

/* ¿me alcanza para lo que viene? */
function prevision(ym){
  ym=ym||ymHoy();
  var lista=compromisos(ym);
  var pend=lista.filter(function(c){ return !c.pagado; });
  var porPagar=pend.reduce(function(a,c){ return a+c.monto; },0);
  var r=resumen(ym);
  /* si ya configuro su saldo, lo que tiene de verdad; si no, solo el neto del mes */
  var sa=saldoActual();
  var yaTengo=(sa===null) ? (r.ing-r.gas-r.aho) : sa;
  /* al principio del mes el sueldo aún no ha caído: contarlo evita la falsa alarma.
     Si ella ya dijo qué espera recibir, se usa eso en vez de adivinar. */
  var cobros=cobrosDe(ym), pendC=cobros.filter(function(c){ return !c.recibido; });
  var porCobrar=pendC.reduce(function(a,c){ return a+c.monto; },0);
  var porEntrar;
  if(S.cobros.length){
    porEntrar=porCobrar;
  }else{
    var refIng=S.perfil.ingresoEsperado || base().ing || 0;
    porEntrar=Math.max(0, refIng-r.ing);
  }
  var disponible=yaTengo+porEntrar;
  var hoyD=new Date().getDate();
  var prox=pend.length ? pend.slice().sort(function(a,b){ return a.dia-b.dia; })[0] : null;
  var dias=prox ? Math.max(1, prox.dia-hoyD) : 0;
  var falta=porPagar-disponible;
  return {lista:lista, pend:pend, porPagar:porPagar, disponible:disponible, falta:falta,
          yaTengo:yaTengo, porEntrar:porEntrar, cobros:cobros, pendC:pendC, porCobrar:porCobrar,
          prox:prox, dias:dias, porDia:(falta>0&&dias>0)?falta/dias:0,
          vencidos:pend.filter(function(c){ return c.estado==='vencido'; })};
}

/* dónde recortar para llegar: las categorías no esenciales más grandes */
function dondeRecortar(ym){
  var r=resumen(ym), top=[];
  Object.keys(r.porCat).forEach(function(k){
    var c=CAT_MAP[k]; if(c && !c.ess) top.push({c:c, v:r.porCat[k]});
  });
  top.sort(function(a,b){ return b.v-a.v; });
  return top.slice(0,3);
}

function compHTML(c, ym){
  var col = c.pagado ? 'var(--accent)'
          : c.estado==='vencido' ? 'var(--out)'
          : c.estado==='proximo' ? 'var(--warn)' : 'var(--muted)';
  var mesN=MESES[+c.fecha.split('-')[1]-1];
  var cuando = c.unica ? ('dia '+c.dia+' de '+mesN) : ('dia '+c.dia);
  var etq = c.pagado ? 'Pago'
          : c.estado==='vencido'
              ? (c.dias<0 ? 'Venceu '+cuando+' · há '+Math.abs(c.dias)+' dia'+(Math.abs(c.dias)>1?'s':'')
                          : 'Ficou sem pagar')

          : c.estado==='proximo' ? 'Vence em '+c.dias+' dia'+(c.dias>1?'s':'')
          : 'Vence '+cuando;
  /* tocar el nombre abre la ficha: asi se corrige o se borra desde aqui mismo */
  var abrir = c.tipo==='deuda' ? 'editarDeuda(\''+c.id+'\')' : 'editarFijo(\''+c.id+'\')';
  return '<div class="pend'+(c.pagado?' ok':'')+'">'+
    '<div class="pd" onclick="'+abrir+'"><div class="nm">'+esc(c.nombre)+' <span class="ed">›</span></div>'+
    '<div class="dt" style="color:'+col+'">'+etq+
      (c.tipo==='deuda'
        ? (c.unica ? ' · empréstimo'
          : (c.cuotasTot ? ' · parcela '+c.cuotaN+' de '+c.cuotasTot : ' · parcela'))
        : '')+'</div></div>'+

    (c.pagado
      ? '<button class="pb done" onclick="editarMov(\''+c.mov.id+'\')" aria-label="Ver">✓</button>'
      : '<button class="pb" onclick="pagarCompromiso(\''+c.id+'\',\''+ym+'\',\''+c.mesRef+'\')">Pagar</button>')+
  '</div>';
}

/* bloque de pendientes dentro de la pantalla Movimientos */
/* todas las deudas registradas, vengan o no este mes */
function deudasHTML(){
  if(!S.deudas.length){
    return '<div class="empty"><div class="pxstage">'+pxa('sleep',1)+'</div>'+
      '<b>Nenhuma dívida cadastrada</b>'+
      '<p>Se você deve para alguém, tem fatura de cartão, financiamento ou consignado, cadastre aqui '+
      'que não esquece.</p>'+
      '<button class="btn soft mt16" onclick="editarDeuda()">Adicionar uma dívida</button></div>';
  }
  var vivas=S.deudas.filter(function(d){ return (d.saldo||0)>0; });
  var total=vivas.reduce(function(a,d){ return a+(d.saldo||0); },0);
  var intTot=vivas.reduce(function(a,d){ return a+interesMensual(d); },0);

  var filas=S.deudas.slice().sort(function(a,b){
    return ((b.saldo||0)>0?1:0)-((a.saldo||0)>0?1:0) || (b.tasa||0)-(a.tasa||0);
  }).map(function(d){
    var pagada=(d.saldo||0)<=0;
    var sub;
    if(pagada) sub='Quitada! 🐾';
    else if(d.tipo==='unica' && d.fecha){
      var p=d.fecha.split('-'), hoy0=new Date(); hoy0.setHours(0,0,0,0);
      var dd=Math.round((new Date(+p[0],+p[1]-1,+p[2])-hoy0)/86400000);
      sub='Pagamento único · '+(dd<0 ? 'venceu há '+Math.abs(dd)+' dia'+(Math.abs(dd)>1?'s':'')
            : (dd===0?'vence hoje':'vence em '+(+p[2])+' de '+MESES[+p[1]-1]));
    }
    else if(d.tipo==='cuotas' && d.fecha && d.n>0){
      var ec=estadoCuotas(d);
      if(ec.sig<0) sub=d.n+' parcelas · todas pagas';
      else{
        var fS=fechaDe(mesCuota(d.fecha,ec.sig), +d.fecha.slice(8,10)).split('-');
        sub='Parcela '+(ec.sig+1)+' de '+d.n+' · '+money(d.cuota||0)+
            ' em '+(+fS[2])+' de '+MESES[+fS[1]-1];
      }
    }
    else if(d.cuota>0 && d.dia>0) sub='Parcela de '+money(d.cuota)+' todo dia '+d.dia;
    else sub='Sem data · toque para pôr uma';
    if(!pagada && (d.tasa||0)>0) sub+=' · '+String(d.tasa).replace('.',',')+'% a.a.';

    return '<div class="pend'+(pagada?' ok':'')+'">'+
      '<div class="pd" onclick="editarDeuda(\''+d.id+'\')">'+
      '<div class="nm">'+esc(d.nombre)+' <span class="ed">›</span></div>'+
      '<div class="dt" style="color:'+(pagada?'var(--accent)':((d.tasa||0)>=REF.usura?'var(--out)':'var(--muted)'))+'">'+sub+'</div></div>'+
      '<div class="pa tnum">'+money(d.saldo||0)+'</div>'+
      (pagada ? '<span class="pb done">✓</span>'
              : '<button class="pb" onclick="pagarDeuda(\''+d.id+'\')">Pagar</button>')+
    '</div>';
  }).join('');

  return '<div class="card"><div class="row"><h3 style="margin:0">Tudo o que você deve</h3>'+
    '<b class="tnum" style="font-size:17px;color:'+(total>0?'var(--out)':'var(--accent)')+'">'+money(total)+'</b></div>'+
    (intTot>0
      ? '<div class="s12 faint" style="margin:4px 0 2px">Só de juros elas custam '+money(intTot)+' por mês. '+
        'Pague da maior taxa para a menor. Toque para quitar uma inteira de uma vez.</div>'
      : '<div class="s12 faint" style="margin:4px 0 2px">Toque para editar ou para quitar de uma vez.</div>')+
    filas+
    (intTot>0
      ? '<div class="s12 faint mt12">De cada parcela que você registra, o My Wallet desconta primeiro os '+
        'juros do mês e baixa o saldo com o resto. É uma estimativa: se você usar o cartão de novo ou '+
        'cobrarem algo extra, o saldo real muda. Compare com a fatura de vez em quando e corrija aqui.</div>'
      : '')+
    '<button class="btn ghost sm mt16" style="width:100%" onclick="editarDeuda()">+ Adicionar outra dívida</button>'+
  '</div>';
}

/* abono a una deuda desde la pestaña: si es el compromiso del mes, mantiene el vínculo */
function pagarDeuda(id){
  var d=deudaDe(id); if(!d) return;
  var ym=ymHoy();
  var c=compromisos(ym).filter(function(x){ return x.id===id && !x.pagado; })[0];
  if(c){ pagarCompromiso(id, ym); return; }
  /* el saldo no incluye los intereses del mes: si sugiriéramos solo el saldo,
     ella paga lo que le dijimos y le queda un resto raro debiendo */
  var totalHoy=(d.saldo||0)+interesMensual(d);
  ADD={tipo:'out', monto:String(Math.round(d.cuota>0?Math.min(d.cuota,totalHoy):totalHoy)),
       cat:'deudas', destino:'colchon', fecha:hoyISO(), nota:d.nombre, id:null, retiro:false,
       ref:d.id, refMes:null, refNombre:d.nombre};
  renderAdd();
}

/* registrar el pago: abre el teclado ya lleno y amarrado al compromiso */
function pagarCompromiso(id, ym, mesRef){
  var l=compromisos(ym).filter(function(x){ return x.id===id && (!mesRef || x.mesRef===mesRef); });
  var c=l.filter(function(x){ return !x.pagado; })[0] || l[0];
  if(!c) return;
  ADD={tipo:'out', monto:String(Math.round(c.monto)), cat:c.cat, destino:'colchon',
       /* si ya se venció, la plata sale hoy, no en la fecha en que debía salir */
       fecha:(c.fecha>hoyISO()?c.fecha:hoyISO()), nota:c.nombre, id:null, retiro:false,
       ref:c.id, refMes:c.mesRef, refNombre:c.nombre, refDia:c.dia, refTipo:c.tipo};
  renderAdd();
}

/* marcar que ya entró: abre el teclado como ingreso y amarrado al cobro */
function recibirCobro(id, ym, mesRef){
  var l=cobrosDe(ym).filter(function(x){ return x.id===id && (!mesRef || x.mesRef===mesRef); });
  var c=l.filter(function(x){ return !x.recibido; })[0] || l[0];
  if(!c) return;
  ADD={tipo:'in', monto:String(Math.round(c.monto)), cat:cobroCat(c), destino:'colchon',
       /* si se atrasó, la plata entra hoy, no el día en que debía entrar */
       fecha:(c.fecha>hoyISO()?c.fecha:hoyISO()), nota:c.nombre, id:null, retiro:false,
       refc:c.id, refcMes:c.mesRef, refcNombre:c.nombre};
  renderAdd();
}
function cobroDatos(id){ return S.cobros.filter(function(c){ return c.id===id; })[0]; }
function cobroCat(c){
  var d=cobroDatos(c.id);
  return (d && d.cat) ? d.cat : (c.unica ? 'otros_in' : 'salario');
}

/* de la cuota, lo que de verdad baja la deuda (el resto son intereses) */
/* lo que costaría soltarla hoy: en las de cuotas el interés ya está dentro */
function totalDeuda1(d){
  if(!d || !((d.saldo||0)>0)) return 0;
  return Math.round((d.saldo||0) + (d.tipo==='cuotas' ? 0 : interesMensual(d)));
}
/* pagarla toda de una: abre el teclado con el total y amarrado a la deuda */
function saldarDeuda(id){
  var d=deudaDe(id); if(!d) return;
  var total=totalDeuda1(d);
  if(total<=0){ toast('Essa dívida já está zerada'); return; }
  var c=compromisos(ymHoy()).filter(function(x){ return x.id===id && !x.pagado; })[0];
  ADD={tipo:'out', monto:String(total), cat:'deudas', destino:'colchon',
       fecha:hoyISO(), nota:d.nombre, id:null, retiro:false, saldar:true,
       ref:d.id, refMes:c?c.mesRef:null, refNombre:d.nombre};
  renderAdd();
}

function abonoDe(id, monto){
  var d=deudaDe(id); if(!d) return 0;
  /* numa compra parcelada os juros ja vem dentro da parcela: se descontassemos
     de novo aqui, o saldo nunca chegaria a zero */
  if(d.tipo==='cuotas') return Math.max(0, Math.round(monto));
  /* inteiro, em centavos: e o mesmo numero que vai para o saldo e que volta
     se o pagamento for apagado. Sem arredondar aqui, sobrava fracao de centavo */
  return Math.max(0, Math.round(monto-interesMensual(d)));
}
function ajustarDeuda(id, delta){
  var d=deudaDe(id); if(!d) return;
  var v=Math.max(0, (d.saldo||0)+delta);
  /* menos de um centavo e ruido de arredondamento: a divida esta paga */
  d.saldo = v<1 ? 0 : Math.round(v);
}

/* mensual o pago unico: lo mismo sirve para una deuda y para un gasto fijo */
function segTipo(t, conCuotas){
  return '<div class="seg" id="tipoSeg">'+
    (conCuotas ? [['mensual','Todo mês'],['cuotas','Parcelado'],['unica','Uma vez só']]
               : [['mensual','Todo mês'],['unica','Uma vez só']]).map(function(x){
      return '<button data-t="'+x[0]+'" class="'+(t===x[0]?'on':'')+'" '+
             'onclick="tipoComp(\''+x[0]+'\')">'+x[1]+'</button>'; }).join('')+
  '</div>';
}
function tipoComp(t){
  var seg=document.getElementById('tipoSeg'); if(!seg) return;
  [].forEach.call(seg.querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-t')===t);
  });
  var m=document.getElementById('campoMensual'), u=document.getElementById('campoUnica'),
      q=document.getElementById('campoCuotas');
  if(m) m.hidden = (t!=='mensual');
  if(u) u.hidden = (t!=='unica');
  if(q) q.hidden = (t!=='cuotas');
  calcCuota();
}
/* muestra de cuánto queda cada cuota mientras ella escribe */
function calcCuota(){
  var av=document.getElementById('avisoCuota'); if(!av) return;
  var sal=unfmt((document.getElementById('dSal')||{}).value||0);
  var n=parseInt(String((document.getElementById('dN')||{}).value||'').replace(/[^\d]/g,''),10)||0;
  av.innerHTML = (sal>0 && n>1)
    ? 'Seriam <b>'+n+' parcelas de '+money(Math.round(sal/n))+'</b>.'
    : 'Divide o que você deve pelo número de parcelas.';
}
function tipoCompActual(){
  var b=document.querySelector('#tipoSeg button.on');
  return b ? b.getAttribute('data-t') : 'mensual';
}

/* ---- gastos fijos ---- */
function editarFijo(id){
  var f = id ? S.fijos.filter(function(x){ return x.id===id; })[0] : null;
  var cats=CATS.out;
  var sel = f?f.cat:'arriendo';

    '<label class="f">Quanto você paga por mês?</label>'+
    '<input class="f tnum" id="fMon" inputmode="numeric" placeholder="R$ 0,00" value="'+(f?fmtNum(f.monto):'')+'" oninput="fmtIn(this)">'+
    '<label class="f">De quanto em quanto tempo?</label>'+
    segTipo(f&&f.tipo==='unica'?'unica':'mensual')+
    '<div id="campoMensual"'+(f&&f.tipo==='unica'?' hidden':'')+'>'+
      '<label class="f">Vence em que dia do mês?</label>'+
      '<input class="f tnum" id="fDia" inputmode="numeric" placeholder="Ex: 5" value="'+(f&&f.dia?f.dia:'')+'">'+
    '</div>'+
    '<div id="campoUnica"'+(f&&f.tipo==='unica'?'':' hidden')+'>'+
      '<label class="f">Em que dia se paga?</label>'+
      '<input class="f" type="date" id="fFecha" value="'+(f&&f.fecha?f.fecha:'')+'">'+
      '<div class="s12 faint mt8">Para algo que se paga uma vez só: a matrícula, um conserto, o IPVA.</div>'+
    '</div>'+
    '<label class="f">Categoria</label><div class="catgrid" id="fCat">'+
      cats.map(function(c){
        return '<button class="'+(sel===c.id?'on':'')+'" data-c="'+c.id+'" onclick="pickCat(this)">'+
          '<span class="e">'+c.e+'</span>'+esc(c.n)+'</button>'; }).join('')+'</div>'+
    '<button class="btn mt20" onclick="guardarFijo(\''+(id||'')+'\')">'+(f?'Salvar':'Adicionar conta')+'</button>'+
    (f?'<button class="btn ghost mt12" style="color:var(--danger)" onclick="borrarFijo(\''+id+'\')">Eliminar</button>':'');
  sheet(f?'Editar conta fixa':'Nova conta fixa', h);
}
function pickCat(b){
  var bs=b.parentNode.querySelectorAll('button');
  for(var i=0;i<bs.length;i++) bs[i].classList.remove('on');
  b.classList.add('on');
}
function guardarFijo(id){
  var nom=(document.getElementById('fNom').value||'').trim();
  var mon=unfmt(document.getElementById('fMon').value);
  var tp=tipoCompActual(), dia=0, fch='';
  if(tp==='unica') fch=(document.getElementById('fFecha')||{}).value||'';
  else dia=Math.max(0, Math.min(31, parseInt(String((document.getElementById('fDia')||{}).value||'').replace(/[^\d]/g,''),10)||0));
  var sel=document.querySelector('#fCat button.on');
  var cat=sel?sel.getAttribute('data-c'):'otros_out';
  if(!nom){ toast('Dê um nome'); return; }
  if(mon<=0){ toast('Quanto você paga?'); return; }
  if(tp==='unica' ? !fch : !dia){ toast(tp==='unica'?'Em que dia se paga?':'Em que dia vence?'); return; }
  var campos={nombre:nom, monto:mon, dia:dia, cat:cat, tipo:tp, fecha:fch};
  if(id){ S.fijos.forEach(function(f){ if(f.id===id){ for(var k in campos) f[k]=campos[k]; } }); }
  else { campos.id=uid(); S.fijos.push(campos); }
  cerrarSheet(); pintarTodo(); toast('Pronto ✓');
}
function borrarFijo(id){
  if(!confirm('Apagar esta conta fixa? Os pagamentos que você já registrou continuam nos movimentos.')) return;
  S.fijos=S.fijos.filter(function(f){ return f.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Apagado');
}

  S.mov.forEach(function(m){ if(m.tipo==='save' && m.destino===id) m.destino='colchon'; });

function guardarDeuda(id){
  var nom=(document.getElementById('dNom').value||'').trim();
  var sal=unfmt(document.getElementById('dSal').value);
  var tasa=+String(document.getElementById('dTasa').value||'').replace(',','.')||0;
  if(!nom){ toast('Dê um nome'); return; }
  if(sal<=0){ toast('Quanto você deve?'); return; }
  var tp=tipoCompActual(), cuo=0, dia=0, fch='', n=0;
  if(tp==='unica'){
    fch=(document.getElementById('dFecha')||{}).value||'';
    if(!fch){ toast('Em que dia você tem que pagar?'); return; }
  }else if(tp==='cuotas'){
    n=parseInt(String((document.getElementById('dN')||{}).value||'').replace(/[^\d]/g,''),10)||0;
    fch=(document.getElementById('dPrimera')||{}).value||'';
    if(n<2){ toast('Em quantas parcelas? Ponha 2 ou mais'); return; }
    if(!fch){ toast('Quando você paga a primeira parcela?'); return; }
    cuo=Math.round(sal/n);
    dia=+fch.slice(8,10);
  }else{
    cuo=unfmt((document.getElementById('dCuota')||{}).value||0);
    dia=Math.max(0, Math.min(31, parseInt(String((document.getElementById('dDia')||{}).value||'').replace(/[^\d]/g,''),10)||0));
  }
  var campos={nombre:nom, saldo:sal, tasa:tasa, cuota:cuo, dia:dia, tipo:tp, fecha:fch, n:n};
  if(id){ S.deudas.forEach(function(x){ if(x.id===id){ for(var k in campos) x[k]=campos[k]; } }); }
  else { campos.id=uid(); S.deudas.push(campos); }
  cerrarSheet(); pintarTodo(); toast('Pronto ✓');
}
function borrarDeuda(id){
  S.deudas=S.deudas.filter(function(x){ return x.id!==id; });
  cerrarSheet(); pintarTodo(); toast('Dívida apagada 🎉');
}

/* una línea de «va a entrar», con su botón de ya entró */
function cobroHTML(c, ym){
  var col = c.recibido ? 'var(--accent)'
          : c.estado==='atrasado' ? 'var(--out)'
          : c.estado==='proximo' ? 'var(--warn)' : 'var(--muted)';
  var mesN=MESES[+c.fecha.split('-')[1]-1];
  var cuando = c.unica ? ('dia '+c.dia+' de '+mesN) : ('dia '+c.dia);
  var etq = c.recibido ? 'Caiu'
          : c.estado==='atrasado'
              ? (c.dias<0 ? 'Era para entrar '+cuando+' · há '+Math.abs(c.dias)+' dia'+(Math.abs(c.dias)>1?'s':'')
                          : 'Não entrou')
          : c.dias===0 ? 'Entra hoje'
          : c.estado==='proximo' ? 'Entra em '+c.dias+' dia'+(c.dias>1?'s':'')
          : 'Entra '+cuando;
  return '<div class="pend'+(c.recibido?' ok':'')+'">'+
    '<div class="pd" onclick="editarCobro(\''+c.id+'\')"><div class="nm">'+esc(c.nombre)+' <span class="ed">›</span></div>'+
    '<div class="dt" style="color:'+col+'">'+etq+(c.unica?' · te devem':'')+'</div></div>'+
    '<div class="pa tnum in">+'+money(c.monto)+'</div>'+
    (c.recibido
      ? '<button class="pb done" onclick="editarMov(\''+c.mov.id+'\')" aria-label="Ver">✓</button>'
      : '<button class="pb" onclick="recibirCobro(\''+c.id+'\',\''+ym+'\',\''+c.mesRef+'\')">Caiu</button>')+
  '</div>';
}

function cobrosCardHTML(){
  if(!S.cobros.length){
    return '<div class="empty"><div class="pxstage">'+pxa('sleep',1)+'</div>'+
      '<b>Nada a receber ainda</b>'+

  }
  var l=cobrosDe(ymHoy());
  var pend=l.filter(function(c){ return !c.recibido; });
  var tot=pend.reduce(function(a,c){ return a+c.monto; },0);
  var atras=pend.filter(function(c){ return c.estado==='atrasado'; });

{id:'cuanto-ahorrar', c:'basicos', t:'Quanto eu deveria guardar por mês?',
 k:'quanto guardar poupar porcentagem 20% quanto devo meta',
 r:'A referência é 20% do que você ganha. O que vale mesmo é ser constante, não o valor.',
 b:'<p>A referência clássica é <b>20% da renda</b>. Mas é referência, não regra: se hoje você consegue 5%, '+
   'guarde 5% todo mês. Vale muito mais do que prometer 20% e desistir no segundo mês.</p>'+
   '<p>O que constrói patrimônio não é o valor, é a <b>constância</b>. <span class="num">R$ 200</span> por mês '+
   'durante três anos viram mais do que <span class="num">R$ 2.000</span> guardados uma vez só e esquecidos.</p>'+
   '<p><b>O truque que funciona:</b> separe assim que o dinheiro cair, não no fim do mês. O que sobra no fim do mês '+
   'nunca sobra. Se o seu banco deixa programar uma transferência automática para o dia do pagamento, resolve — '+
   'aí não depende de força de vontade.</p>'},

{id:'503020', c:'basicos', t:'A regra 50 / 30 / 20',
 k:'50 30 20 regra dividir orcamento porcentagem',
 r:'50% indispensável, 30% extras, 20% guardado. É uma bússola, não uma lei.',
 b:'<p>Divide a renda em três: <b>50% no indispensável</b> (moradia, mercado, transporte, contas, remédio), '+
   '<b>30% no que você escolhe</b> (comer fora, lazer, compras) e <b>20% guardado</b>.</p>'+
   '<p>Serve para dar um susto útil: quase todo mundo descobre que o «indispensável» está em 70% e o guardado em zero.</p>'+
   '<p><b>Mas é uma bússola, não uma lei.</b> Em São Paulo ou no Rio, um aluguel sozinho já leva mais de 50%. '+
   'Isso não significa que você fracassou: significa que a sua conta tem uma restrição que a regra genérica não conhece. '+
   'Use os números para decidir, não para se punir.</p>'},

{id:'compuesto', c:'basicos', t:'Juros compostos: por que o tempo importa tanto',
 k:'juros compostos tempo bola de neve render rendimento exponencial',
 r:'Os juros rendem juros. Por isso começar cedo vale mais que começar grande.',
 b:'<p>Juro simples rende só sobre o que você pôs. Juro composto rende também sobre o que já rendeu — e é isso que '+
   'faz a curva virar para cima depois de alguns anos.</p>'+
   '<p>Exemplo com 12% ao ano: <span class="num">R$ 500</span> por mês viram cerca de '+
   '<span class="num">R$ 41 mil</span> em 5 anos (você pôs 30 mil), e cerca de <span class="num">R$ 115 mil</span> '+
   'em 10 anos (você pôs 60 mil). Dobrou o tempo, quase triplicou o resultado.</p>'+
   '<p>É por isso que o melhor dia para começar foi há dez anos e o segundo melhor é hoje.</p>'+
   '<div class="alerta">A mesma matemática funciona contra você na dívida. O rotativo do cartão é juro composto '+
   'a mais de 400% ao ano — a bola de neve rola para o outro lado, e rápido.</div>'},

{id:'selic-cdi', c:'basicos', t:'Selic, CDI e IPCA: o que cada um significa',
 k:'selic cdi ipca taxa basica inflacao indice o que e significa',
 r:'Selic é o juro básico do país, o CDI anda colado nela, e o IPCA é a inflação.',
 b:'<p><b>Selic</b> é a taxa básica de juros, definida pelo Banco Central. É o piso de tudo: quando ela sobe, '+
   'renda fixa rende mais e empréstimo fica mais caro.</p>'+
   '<p><b>CDI</b> é a taxa que os bancos cobram entre si por um dia. Na prática anda colada na Selic (um pouquinho '+
   'abaixo). É a régua da renda fixa: quando um CDB diz «110% do CDI», está dizendo que paga 10% a mais que essa régua.</p>'+
   '<p><b>IPCA</b> é a inflação oficial — quanto os preços subiram. É o adversário: se o seu dinheiro rende menos que '+
   'o IPCA, ele está encolhendo mesmo com o número crescendo.</p>'+
   '<div class="tip">A conta que importa é <b>rendimento menos inflação</b>. 10% ao ano com 5% de inflação é ganhar 5%, '+
   'não 10%.</div>'},

{id:'presupuesto', c:'basicos', t:'Como fazer um orçamento que você consegue seguir',
 k:'orcamento planilha planejar categorias controlar gastos',
 r:'Comece registrando, não planejando. O orçamento sai dos seus números reais.',
 b:'<p>Quase todo orçamento fracassa pelo mesmo motivo: foi feito de cabeça, com números que a pessoa acha que gasta. '+
   'Aí o mês real não bate e o orçamento é abandonado.</p>'+
   '<p>Inverta a ordem: <b>registre primeiro, planeje depois</b>. Um mês de registro te dá quanto você gasta de fato '+
   'em cada coisa. Aí sim o orçamento é uma decisão, não um chute.</p>'+
   '<p>Depois disso o trabalho é pequeno: escolha <b>uma</b> categoria para reduzir por mês. Uma só. Mudar cinco '+
   'hábitos ao mesmo tempo não funciona para ninguém.</p>'},

/* ---------------- bancos e contas ---------------- */
{id:'conta-digital', c:'cuentas', t:'Conta de banco grande ou conta digital?',
 k:'conta digital nubank inter banco grande tarifa qual melhor',
 r:'A digital costuma ganhar em tarifa. O que importa é não pagar por serviço que você não usa.',
 b:'<p>As contas digitais (Nubank, Inter, C6, PicPay e cia) em geral não cobram manutenção, e as dos bancos grandes '+
   'costumam vir num «pacote de serviços» que custa de <span class="num">R$ 20</span> a <span class="num">R$ 60</span> '+
   'por mês — <span class="num">R$ 700</span> por ano em algo que talvez você não use.</p>'+
   '<p>Todo banco autorizado pelo Banco Central, digital ou não, tem a mesma proteção do FGC. Tamanho não é segurança.</p>'+
   '<div class="tip">Ligue e peça a <b>conta sem tarifa</b> ou o pacote mais simples. Quase todo banco tem, só não oferece.</div>'},

{id:'tarifas', c:'cuentas', t:'As tarifas que comem seu dinheiro sem você ver',
 k:'tarifa anuidade pacote de servicos cesta manutencao cobranca banco',
 r:'Pacote de serviços, anuidade de cartão e seguro embutido. Some e veja o ano.',
 b:'<p>Três que aparecem quase sempre:</p>'+
   '<p><b>Pacote de serviços.</b> De <span class="num">R$ 20</span> a <span class="num">R$ 60</span>/mês. '+
   'Quase sempre dá para migrar para a conta essencial, que é gratuita por regra do Banco Central.</p>'+
   '<p><b>Anuidade do cartão.</b> Pode passar de <span class="num">R$ 500</span>/ano. Muitos bancos isentam se você '+
   'gastar um mínimo ou pedir — vale a ligação.</p>'+
   '<p><b>Seguros e assinaturas embutidas.</b> Aquele seguro de proteção, o título de capitalização, o app premium. '+
   'Abra a fatura e procure.</p>'+
   '<div class="tip">Some tudo e multiplique por 12. É o número que faz a ligação para o banco valer a pena.</div>'},

{id:'pix', c:'cuentas', t:'PIX: limites, agendamento e golpes',
 k:'pix limite noturno chave golpe transferencia agendar seguranca',
 r:'É grátis para pessoa física, cai na hora, e o limite noturno existe para te proteger.',
 b:'<p>PIX entre pessoas físicas é gratuito e instantâneo, 24 horas. Não tem por que usar TED ou DOC.</p>'+
   '<p><b>Limite noturno.</b> Entre 20h e 6h o limite cai (em geral para <span class="num">R$ 1.000</span>). '+
   'É chato, mas existe porque a maior parte dos sequestros-relâmpago acontece nesse horário. Dá para pedir '+
   'aumento, e o banco leva 24 a 48h para aplicar — de propósito.</p>'+
   '<p><b>Golpe mais comum:</b> alguém se passa por conhecido, de número novo, pedindo um PIX urgente. '+
   'A regra que resolve: ligue para o número antigo antes de mandar. Sempre.</p>'+
   '<div class="alerta">Pagou errado? Peça o <b>MED</b> (Mecanismo Especial de Devolução) no app do banco, '+
   'em até 80 dias. Em fraude, funciona em parte dos casos.</div>'},

{id:'fgc', c:'cuentas', t:'E se o banco quebrar? O FGC',
 k:'fgc garantia banco quebrar seguro 250 mil protecao falencia',
 r:'O FGC devolve até R$ 250 mil por CPF em cada instituição, com teto de R$ 1 milhão a cada 4 anos.',
 b:'<p>O Fundo Garantidor de Créditos cobre <b>R$ 250 mil por CPF em cada instituição</b>, com um teto global de '+
   '<b>R$ 1 milhão a cada 4 anos</b>. Cobre conta corrente, poupança, CDB, LCI e LCA.</p>'+
   '<p>Por isso um CDB de banco pequeno pagando 120% do CDI não é irresponsabilidade, desde que você fique abaixo '+
   'do limite: se o banco quebrar, o FGC devolve — costuma levar algumas semanas.</p>'+
   '<p><b>O que o FGC NÃO cobre:</b> fundos de investimento, ações, debêntures e o Tesouro Direto. '+
   'O Tesouro não precisa: quem deve é o governo, que é o risco mais baixo que existe em reais.</p>'+
   '<div class="tip">Passou dos 250 mil num banco? Divida entre instituições. É a única «diversificação» que '+
   'realmente importa em renda fixa.</div>'},

{id:'poupanca', c:'cuentas', t:'Poupança: por que quase nunca vale a pena',
 k:'poupanca rende pouco vale a pena caderneta melhor que',
 r:'Rende bem menos que o CDI. A única vantagem é a isenção de IR, que não compensa.',
 b:'<p>Com a Selic acima de 8,5%, a poupança rende <b>0,5% ao mês mais TR</b> — algo perto de 7% ao ano. '+
   'No mesmo período, um CDB de liquidez diária a 100% do CDI paga perto do dobro.</p>'+
   '<p>A poupança é isenta de IR, e é o argumento que sempre aparece. Mas mesmo com o IR de 22,5% (a alíquota mais '+
   'alta, de quem saca antes de 6 meses), o CDB ainda ganha. A conta não fecha para a poupança.</p>'+
   '<p>As vantagens reais dela são outras: todo mundo entende, não tem prazo, e rende na mesma hora. '+
   'Se for a diferença entre guardar e não guardar, a poupança ganha de lavada.</p>'+
   '<div class="tip">Se for trocar, o caminho mais simples é o <b>Tesouro Selic</b>: mesma liquidez, muito mais '+
   'rendimento, e o risco mais baixo do mercado.</div>'},

{id:'ir-renda-fixa', c:'cuentas', t:'O IR na renda fixa: a tabela regressiva',
 k:'imposto de renda ir renda fixa tabela regressiva 22,5 15 aliquota',
 r:'Quanto mais tempo aplicado, menos IR: de 22,5% a 15%. Só sobre o rendimento.',
 b:'<p>Em CDB, Tesouro e fundos de renda fixa o IR sai <b>só sobre o rendimento</b>, nunca sobre o que você aplicou, '+
   'e cai conforme o tempo:</p>'+
   '<p><b>Até 180 dias:</b> 22,5%<br><b>181 a 360 dias:</b> 20%<br><b>361 a 720 dias:</b> 17,5%<br>'+
   '<b>Acima de 720 dias:</b> 15%</p>'+
   '<p>É recolhido na fonte: você não precisa fazer nada, o valor já chega líquido.</p>'+
   '<p>Isso muda comparações. Um CDB a 110% do CDI resgatado em 3 meses pode render menos que uma LCI isenta '+
   'pagando 95% — porque a LCI não paga IR. Compare sempre o <b>líquido</b>.</p>'+
   '<div class="tip">A calculadora da aba <b>Investir</b> faz essa conta e te diz quanto uma LCI precisaria pagar '+
   'para empatar.</div>'},

{id:'iof', c:'cuentas', t:'IOF: a mordida dos primeiros 30 dias',
 k:'iof imposto 30 dias resgate antes saque tabela',
 r:'Se você resgatar antes de 30 dias, o IOF come parte do rendimento. Depois disso, zero.',
 b:'<p>O IOF incide sobre o <b>rendimento</b> de aplicações resgatadas em menos de 30 dias, numa escala que começa '+
   'em 96% no primeiro dia e chega a 0% no trigésimo.</p>'+
   '<p>Na prática: resgatar no dia 5 significa perder quase todo o rendimento. Esperar até o dia 31 resolve.</p>'+
   '<p>Poupança, LCI e LCA não têm IOF. E depois de 30 dias ele some para todo mundo — por isso quase nunca é '+
   'assunto para quem investe pensando em meses, não em dias.</p>'},

{id:'conta-salario', c:'cuentas', t:'Conta salário: você não é obrigado a ficar nela',
 k:'conta salario portabilidade transferir outro banco empresa',
 r:'Dá para pedir portabilidade e receber em qualquer banco, de graça.',
 b:'<p>A conta salário é aberta pela empresa e serve só para receber. Você <b>não é obrigado</b> a usá-la como conta '+
   'principal, nem a pagar tarifa nela (por regra, ela é gratuita).</p>'+
   '<p>Se prefere outro banco, peça a <b>portabilidade de salário</b>: todo mês o valor é transferido automaticamente, '+
   'sem custo. Faz-se pelo app do banco de destino ou no RH.</p>'},

/* ---------------- dívidas ---------------- */
{id:'rotativo', c:'deudas', t:'Rotativo do cartão: a dívida mais cara do Brasil',
 k:'rotativo cartao credito juro alto fatura nao paguei tudo parcelamento',
 r:'Passa de 400% ao ano. Trocar por qualquer outro empréstimo é quase sempre melhor.',
 b:'<p>Quando você não paga a fatura inteira, o resto entra no <b>rotativo</b> — o crédito mais caro que existe '+
   'legalmente no Brasil, historicamente acima de <b>400% ao ano</b>.</p>'+
   '<p>Para ter ideia: <span class="num">R$ 1.000</span> no rotativo viram cerca de <span class="num">R$ 1.400</span> '+
   'em seis meses, sem você comprar mais nada.</p>'+
   '<p>Desde 2017 o banco é obrigado a te tirar do rotativo depois de 30 dias e oferecer um <b>parcelamento</b> com '+
   'juro menor. Aceite — mas saiba que «menor» ainda costuma ser 150% a 200% ao ano.</p>'+
   '<div class="alerta"><b>O que fazer:</b> troque essa dívida por uma mais barata. Consignado (~25% a.a.), '+
   'empréstimo com garantia, ou até um empréstimo pessoal (~90%) — qualquer um é melhor. É o que se chama '+
   'trocar dívida cara por barata, e é a coisa mais lucrativa que existe quando se está nessa situação.</div>'},

{id:'cheque-especial', c:'deudas', t:'Cheque especial: o segundo mais caro',
 k:'cheque especial limite conta negativa vermelho juros',
 r:'Perto de 130% ao ano. Não é «extensão do salário», é empréstimo caro.',
 b:'<p>O cheque especial custa perto de <b>130% ao ano</b> e é cobrado por dia de uso. O problema é que ele parece '+
   'parte do saldo: o app mostra «disponível» somando o limite, e você gasta sem perceber que entrou no vermelho.</p>'+
   '<p>Desde 2020 existe um teto de tarifa e o banco só pode cobrar 0,25% ao mês sobre o limite acima de '+
   '<span class="num">R$ 500</span> — mas o juro, quando usado, continua alto.</p>'+
   '<div class="tip">Peça ao banco para <b>reduzir seu limite a zero</b> ou configure o app para não mostrar o limite '+
   'somado ao saldo. Não dá para gastar o que você não vê.</div>'},

{id:'pago-minimo', c:'deudas', t:'Pagamento mínimo da fatura: a armadilha',
 k:'pagamento minimo fatura cartao so o minimo divida cresce',
 r:'Pagar o mínimo joga o resto no rotativo. A dívida cresce mais rápido do que você paga.',
 b:'<p>O mínimo (hoje em geral 15% da fatura) foi feito para o banco, não para você. O que fica de fora vai para '+
   'o rotativo, a mais de 400% ao ano.</p>'+
   '<p>Resultado prático: pagando só o mínimo, a fatura do mês seguinte costuma vir <b>maior</b> mesmo sem novas '+
   'compras. É a definição de bola de neve.</p>'+
   '<p><b>Se não dá para pagar tudo:</b> aceite o parcelamento que o banco oferece (juro menor que o rotativo), '+
   'ou troque por um empréstimo mais barato. O que não funciona é ficar no mínimo mês após mês.</p>'},

{id:'sem-juros', c:'deudas', t:'«Parcelado sem juros» existe mesmo?',
 k:'parcelado sem juros 12x desconto a vista vale a pena parcelar',
 r:'Às vezes. O teste é perguntar o preço à vista: se tiver desconto, os juros estavam lá.',
 b:'<p>Em muitas lojas o «sem juros» é real — a loja paga a taxa da maquininha para vender mais. Em outras, '+
   'o preço parcelado já vem inflado.</p>'+
   '<p><b>O teste:</b> pergunte quanto custa à vista no PIX. Se tiver desconto, os juros estavam embutidos e você '+
   'pode decidir com o número na mão.</p>'+
   '<p>Mesmo quando é de verdade sem juros, parcelar tem um custo escondido: <b>compromete a sua renda futura</b>. '+
   'Doze parcelas de <span class="num">R$ 200</span> são <span class="num">R$ 200</span> a menos por mês durante '+
   'um ano inteiro, empilhados com todas as outras parcelas que você já tem.</p>'+
   '<div class="tip">Some as suas parcelas ativas. Se passarem de 30% da renda, o cartão já está decidindo o seu mês '+
   'por você.</div>'},

{id:'consignado', c:'deudas', t:'Consignado: quando faz sentido',
 k:'consignado emprestimo desconto folha aposentado clt juro baixo',
 r:'É o empréstimo mais barato para quem tem acesso. Ótimo para trocar dívida cara, péssimo para consumir.',
 b:'<p>O consignado é descontado direto da folha ou do benefício, então o risco para o banco é baixo — e o juro '+
   'também: costuma ficar perto de <b>1,8% ao mês</b> (~25% ao ano), contra 400% do rotativo.</p>'+
   '<p><b>Quando faz muito sentido:</b> trocar uma dívida cara por ele. Sair do rotativo com um consignado é uma '+
   'das melhores decisões financeiras disponíveis para quem está nessa situação.</p>'+
   '<p><b>Quando é armadilha:</b> usar para consumo. Como a parcela sai antes de você ver o salário, é fácil se '+
   'comprometer por anos e sentir só depois.</p>'+
   '<div class="alerta">Cuidado com «cartão consignado» e com quem liga oferecendo. Empréstimo bom não precisa '+
   'de telemarketing insistente.</div>'},

{id:'serasa', c:'deudas', t:'Nome sujo: como funciona e como sair',
 k:'serasa spc nome sujo negativado score limpar dividas protesto',
 r:'A dívida caduca do cadastro em 5 anos, mas continua existindo. Negociar é quase sempre melhor que esperar.',
 b:'<p>Quando você atrasa, o credor pode negativar seu CPF no Serasa ou SPC. Isso fecha crédito, financiamento '+
   'e às vezes até aluguel.</p>'+
   '<p><b>Os 5 anos.</b> A negativação cai do cadastro depois de 5 anos — mas a dívida <b>não deixa de existir</b>. '+
   'O credor ainda pode cobrar, e muitos voltam a procurar depois.</p>'+
   '<p><b>Negociar costuma ser melhor.</b> Dívida antiga é vendida por centavos, e o desconto oferecido chega a '+
   '80% ou 90%. O Serasa Limpa Nome e o consumidor.gov.br são gratuitos e mostram as ofertas.</p>'+
   '<div class="tip">Antes de aceitar: peça o valor <b>à vista</b>, confirme que a negativação sai em até 5 dias '+
   'úteis, e guarde o comprovante. Se for parcelar, só aceite parcela que cabe de verdade — atrasar de novo '+
   'derruba o acordo e volta tudo.</div>'},

{id:'qual-pagar', c:'deudas', t:'Tenho várias dívidas: qual pago primeiro?',
 k:'qual divida pagar primeiro ordem prioridade juros avalanche bola de neve',
 r:'A de maior juro, sempre. Matematicamente não tem discussão.',
 b:'<p>Ordene pela <b>taxa de juros</b>, não pelo valor. Pagar primeiro a de maior juro é o que economiza mais dinheiro, '+
   'e no Brasil a diferença é brutal: rotativo (400%+) contra consignado (25%) não é comparação, é abismo.</p>'+
   '<p>Ordem típica no Brasil, da mais cara para a mais barata: <b>rotativo do cartão → cheque especial → '+
   'crediário de loja → empréstimo pessoal → consignado → financiamento de veículo → financiamento imobiliário</b>.</p>'+
   '<p>Existe a escola da «bola de neve» (pagar a menor primeiro, pelo efeito psicológico). Funciona para quem '+
   'precisa ver progresso rápido. Mas com juros tão diferentes quanto os daqui, a conta pela taxa ganha por muito.</p>'+
   '<div class="tip">Enquanto ataca a mais cara, pague o mínimo das outras em dia. Atrasar todas para quitar uma '+
   'só piora tudo.</div>'},

{id:'portabilidade', c:'deudas', t:'Portabilidade de dívida: trocar de banco',
 k:'portabilidade divida trocar banco juro menor transferir emprestimo',
 r:'Você pode levar sua dívida para outro banco que cobre menos. É um direito.',
 b:'<p>Assim como existe portabilidade de número de celular, existe de dívida. Se outro banco te oferece juro menor, '+
   'ele quita a sua dívida no banco atual e você passa a dever a ele.</p>'+
   '<p>Como fazer: peça ao seu banco o <b>saldo devedor atualizado</b> e o CET (Custo Efetivo Total). Leve esses '+
   'números a outros bancos. Com uma proposta melhor na mão, volte ao seu — muitas vezes ele cobre para não te perder.</p>'+
   '<div class="tip">Compare sempre o <b>CET</b>, não a taxa anunciada. O CET inclui tarifas e seguros, que é onde '+
   'costuma estar a diferença real.</div>'},

{id:'emprestimo-garantia', c:'deudas', t:'Empréstimo com garantia de imóvel ou carro',
 k:'garantia imovel veiculo home equity refinanciamento juro baixo',
 r:'Juro bem menor, mas você põe o bem em risco. Só para trocar dívida cara, nunca para consumo.',
 b:'<p>Colocando um imóvel ou veículo como garantia, o juro cai muito — pode ficar entre 1,2% e 1,8% ao mês, '+
   'contra 400% do rotativo.</p>'+
   '<p><b>O risco é real:</b> se você não pagar, perde o bem. Não é uma figura de linguagem.</p>'+
   '<p>Por isso só faz sentido em um cenário: <b>trocar uma dívida cara por uma barata</b>, com a parcela cabendo '+
   'no orçamento com folga. Nunca para comprar algo, nunca para «aproveitar a oportunidade».</p>'},

{id:'juro-legal', c:'deudas', t:'Existe juro ilegal no Brasil?',
 k:'juro ilegal usura limite maximo agiota abusivo',
 r:'Entre bancos não há teto. Fora do sistema financeiro, o limite é 1% ao mês.',
 b:'<p>Ao contrário de muitos países, o Brasil <b>não tem teto de juros para instituições financeiras</b>. '+
   'Foi isso que permitiu o rotativo chegar a 400% ao ano legalmente.</p>'+
   '<p>Fora do sistema financeiro (uma pessoa emprestando para outra), a Lei da Usura limita a <b>1% ao mês</b>. '+
   'Quem cobra mais que isso sem ser instituição autorizada está cometendo crime.</p>'+
   '<div class="alerta">Agiota cobra 20%, 30% ao mês e usa ameaça como cobrança. Se você está nessa, procure '+
   'a Defensoria Pública — o contrato é nulo e há proteção.</div>'},

{id:'negociar', c:'deudas', t:'Como negociar uma dívida e não se enrolar de novo',
 k:'negociar divida acordo desconto parcelar feirao limpa nome',
 r:'Peça o valor à vista, confirme por escrito, e só aceite parcela que cabe.',
 b:'<p><b>Antes de ligar:</b> saiba quanto você consegue pagar por mês, de verdade. Vá com esse número decidido.</p>'+
   '<p><b>Peça sempre o à vista primeiro.</b> É onde está o maior desconto — em dívidas antigas chega a 90%. '+
   'Se não tiver o valor, aí sim discuta parcelas.</p>'+
   '<p><b>Exija por escrito:</b> valor total, número de parcelas, e a confirmação de que o nome sai do cadastro. '+
   'Guarde o boleto de quitação para sempre.</p>'+
   '<div class="alerta">O erro mais caro é aceitar uma parcela apertada para «resolver logo». Se atrasar, o acordo '+
   'cai, os descontos somem e você volta ao início — só que com menos dinheiro.</div>'},

{id:'fatura-alta', c:'deudas', t:'A fatura veio maior do que eu esperava',
 k:'fatura alta surpresa cartao gastei mais assinaturas parcelas',
 r:'Quase sempre são parcelas antigas somadas com assinaturas esquecidas.',
 b:'<p>A fatura surpreende porque ela junta três coisas que você nunca vê juntas: as compras do mês, '+
   '<b>as parcelas de meses anteriores</b>, e as assinaturas automáticas.</p>'+
   '<p>Abra a fatura e separe nessas três pilhas. Na maioria das vezes o vilão não é o mês, são as parcelas que '+
   'você já esqueceu que existiam.</p>'+
   '<div class="tip">Cadastre suas parcelas no My Wallet, em <b>Dívidas → Parcelado</b>. Aí você vê quanto do mês '+
   'que vem já está comprometido, antes de gastar.</div>'},

/* ---------------- guardar e investir ---------------- */
{id:'tesouro', c:'invertir', t:'Tesouro Direto: os três tipos, sem mistério',
 k:'tesouro direto selic ipca prefixado qual escolher governo',
 r:'Selic para a reserva, IPCA+ para o longo prazo, Prefixado só se você tem opinião sobre juros.',
 b:'<p>É você emprestando para o governo. O risco mais baixo que existe em reais — menor até que banco.</p>'+
   '<p><b>Tesouro Selic.</b> Acompanha a Selic, não cai de preço, dá para vender qualquer dia. '+
   'É o melhor lugar para a reserva de emergência, ponto.</p>'+
   '<p><b>Tesouro IPCA+.</b> Paga a inflação <b>mais</b> uma taxa. É o único que garante que você vai ganhar da '+
   'inflação, e por isso é o certo para objetivos de muitos anos (aposentadoria, faculdade do filho). '+
   'Se vender antes do vencimento, pode perder dinheiro.</p>'+
   '<p><b>Tesouro Prefixado.</b> Você trava uma taxa hoje. Ganha se os juros caírem, perde se subirem. '+
   'Só faça se você entende que está apostando na direção dos juros.</p>'+
   '<div class="tip">Tem taxa de custódia de 0,20% ao ano da B3, isenta para o Tesouro Selic até '+
   '<span class="num">R$ 10 mil</span>. Escolha uma corretora que não cobre taxa própria — várias não cobram.</div>'},

{id:'cdt', c:'invertir', t:'CDB: o que olhar antes de aplicar',
 k:'cdb banco liquidez diaria percentual cdi vencimento aplicar',
 r:'Olhe três coisas: % do CDI, se tem liquidez diária, e se está dentro do FGC.',
 b:'<p>CDB é você emprestando para o banco. Ele paga um percentual do CDI.</p>'+
   '<p><b>1. Quanto do CDI.</b> Bancão costuma pagar 90% a 100%. Banco médio, de 105% a 120% para atrair cliente. '+
   'A diferença é grande: 120% do CDI rende um terço a mais que 90%.</p>'+
   '<p><b>2. Liquidez.</b> «Liquidez diária» = saca quando quiser. «No vencimento» = travado até a data, e rende '+
   'mais em troca. Reserva de emergência só em liquidez diária.</p>'+
   '<p><b>3. FGC.</b> Fique abaixo de <span class="num">R$ 250 mil</span> por banco e o risco de o banco pequeno '+
   'quebrar deixa de ser seu problema.</p>'+
   '<div class="tip">CDB paga IR pela tabela regressiva. Compare sempre o líquido com o de uma LCI isenta.</div>'},

{id:'lci-lca', c:'invertir', t:'LCI e LCA: as isentas de imposto',
 k:'lci lca isento imposto de renda imobiliario agronegocio carencia',
 r:'Não pagam IR, mas têm carência. Um número menor pode valer mais que um maior.',
 b:'<p>LCI (crédito imobiliário) e LCA (agronegócio) são empréstimos ao banco, como o CDB — mas '+
   '<b>isentas de Imposto de Renda</b> para pessoa física, e também cobertas pelo FGC.</p>'+
   '<p>Por isso não dá para comparar os números direto. Uma LCI a 95% do CDI pode render mais, no bolso, '+
   'que um CDB a 110% — depende do prazo e da alíquota de IR que incidiria.</p>'+
   '<p><b>O custo:</b> têm carência (em geral 90 dias no mínimo, muitas vezes bem mais). Não servem para reserva '+
   'de emergência.</p>'+
   '<div class="tip">A calculadora da aba <b>Investir</b> te dá exatamente o número: quanto uma isenta precisaria '+
   'pagar para empatar com o CDB que você está olhando.</div>'},

{id:'onde-reserva', c:'invertir', t:'Onde deixar a reserva de emergência',
 k:'onde deixar reserva emergencia liquidez diaria seguro resgate',
 r:'Tesouro Selic ou CDB de liquidez diária a 100% do CDI ou mais. Nada além disso.',
 b:'<p>A reserva tem três exigências, e só três: <b>sair no mesmo dia</b>, <b>não poder cair de preço</b>, '+
   'e render pelo menos perto do CDI.</p>'+
   '<p>Duas opções atendem: <b>Tesouro Selic</b> (resgate em D+1, às vezes no mesmo dia) e <b>CDB de liquidez '+
   'diária</b> pagando 100% do CDI ou mais.</p>'+
   '<p><b>O que não serve:</b> ação, fundo imobiliário, cripto (caem de preço), LCI/LCA e CDB com vencimento '+
   '(travados), e previdência (carência e taxa).</p>'+
   '<div class="alerta">Poupança «serve» tecnicamente, mas rende quase metade. Em <span class="num">R$ 10.000</span> '+
   'a diferença passa de <span class="num">R$ 700</span> por ano — de graça.</div>'},

{id:'fundos', c:'invertir', t:'Fundos de investimento: cuidado com a taxa',
 k:'fundo investimento taxa administracao come cotas performance gerente',
 r:'A taxa de administração come o rendimento silenciosamente. Acima de 1% ao ano, desconfie.',
 b:'<p>Fundo é um bolo de dinheiro de várias pessoas, gerido por um profissional. Você paga por isso.</p>'+
   '<p><b>Taxa de administração.</b> Cobrada sobre o total, todo ano, rendendo ou não. Um fundo de renda fixa '+
   'com 2% ao ano de taxa entrega bem menos que um CDB, porque a taxa come boa parte do que ele ganha.</p>'+
   '<p><b>Come-cotas.</b> Fundos de renda fixa e multimercado têm antecipação de IR em maio e novembro, '+
   'o que reduz o efeito dos juros compostos.</p>'+
   '<p>Regra prática: em renda fixa simples, fundo com taxa acima de <b>0,5% ao ano</b> raramente vale — o CDB '+
   'ou o Tesouro fazem o mesmo mais barato. Em fundos de ação ou multimercado, a taxa pode se justificar, '+
   'mas aí você precisa saber o que está comprando.</p>'+
   '<div class="alerta">Se o gerente do banco te ofereceu, verifique a taxa antes. É onde estão os piores fundos '+
   'do mercado, vendidos justamente porque pagam comissão.</div>'},

{id:'acoes-etf', c:'invertir', t:'Ações e ETFs: o básico antes de entrar',
 k:'acoes bolsa etf ibovespa investir renda variavel dividendos',
 r:'Só entra dinheiro que pode ficar 5 anos parado. ETF é o jeito mais simples de começar.',
 b:'<p>Ação é um pedacinho de uma empresa. Pode subir, pode cair, e pode cair por anos.</p>'+
   '<p><b>A regra que evita o maior erro:</b> só ponha aqui dinheiro que você não vai precisar por pelo menos '+
   '5 anos. Quem precisa sacar na baixa transforma oscilação em prejuízo real.</p>'+
   '<p><b>ETF</b> é um fundo negociado em bolsa que replica um índice. Comprando um ETF de Ibovespa você compra '+
   'um pedaço das maiores empresas do país de uma vez, com taxa baixíssima. Para quem começa, é bem melhor que '+
   'escolher ações individuais.</p>'+
   '<p><b>IR:</b> vendas de ações até <span class="num">R$ 20 mil</span> por mês são isentas. ETF não tem essa '+
   'isenção: paga 15% sobre o ganho, sempre.</p>'},

{id:'previdencia', c:'invertir', t:'Previdência privada: PGBL ou VGBL?',
 k:'previdencia privada pgbl vgbl aposentadoria declaracao completa taxa',
 r:'PGBL só se você declara no completo. VGBL para o resto. Olhe a taxa antes de tudo.',
 b:'<p><b>PGBL:</b> você abate até 12% da renda bruta na declaração — mas só faz sentido se você declara no '+
   '<b>modelo completo</b> e contribui para o INSS. No resgate, o IR incide sobre o total.</p>'+
   '<p><b>VGBL:</b> não abate nada, mas no resgate o IR incide <b>só sobre o rendimento</b>. É o certo para quem '+
   'declara no simplificado ou é isento.</p>'+
   '<p><b>Tabela regressiva:</b> se você vai deixar mais de 10 anos, escolha a regressiva — a alíquota cai até 10%, '+
   'menor que qualquer outra aplicação.</p>'+
   '<div class="alerta">O maior problema da previdência bancária é a <b>taxa de administração</b>. Acima de 1% ao ano '+
   'ela costuma comer todo o benefício fiscal. Verifique antes de assinar, e compare com fazer o mesmo no '+
   'Tesouro IPCA+.</div>'},

{id:'quanto-rende', c:'invertir', t:'Quanto rende R$ 1.000 por mês?',
 k:'quanto rende mil reais por mes simulacao exemplo numeros',
 r:'A ordem de grandeza importa mais que a precisão. Veja a diferença entre 7% e 14% ao ano.',
 b:'<p>Guardando <span class="num">R$ 1.000</span> por mês, o resultado depende muito de onde você põe:</p>'+
   '<p><b>Na conta corrente (0%):</b> R$ 60.000 em 5 anos. Exatamente o que você pôs — e valendo menos, por causa '+
   'da inflação.</p>'+
   '<p><b>Na poupança (~7% a.a.):</b> cerca de R$ 71 mil.</p>'+
   '<p><b>A 100% do CDI (~14% a.a., já com IR):</b> cerca de R$ 83 mil.</p>'+
   '<p>São mais de <span class="num">R$ 12 mil</span> de diferença entre a poupança e um CDB comum, pelo mesmo '+
   'esforço e com o mesmo risco. É a decisão mais barata de tomar e a mais cara de adiar.</p>'+
   '<div class="tip">Use a calculadora «Se eu guardar todo mês» na aba <b>Investir</b> com os seus números.</div>'},

{id:'estafas', c:'invertir', t:'Como não cair em pirâmide ou golpe',
 k:'golpe piramide estelionato rendimento garantido cripto bitcoin fraude',
 r:'Rendimento alto e garantido não existe. E precisar trazer gente é a definição de pirâmide.',
 b:'<p>Quatro sinais que aparecem em quase todos:</p>'+
   '<p><b>1. Rendimento alto e «garantido».</b> 3%, 5%, 10% ao mês. Se existisse sem risco, bancos e fundos fariam '+
   'em escala. Rendimento e risco andam juntos, sempre.</p>'+
   '<p><b>2. Você precisa trazer pessoas.</b> Isso é pirâmide — o dinheiro dos novos paga os antigos até acabar. '+
   'E sempre acaba.</p>'+
   '<p><b>3. Pressão para decidir agora.</b> «Última chance», «vagas limitadas». Oportunidade real aguenta uma semana '+
   'de reflexão.</p>'+
   '<p><b>4. Não está na CVM nem no Banco Central.</b> Dá para consultar de graça, em um minuto, no site de cada um.</p>'+
   '<div class="alerta">Se já perdeu dinheiro: registre boletim de ocorrência e denuncie na CVM. E desconfie de '+
   'quem aparecer prometendo «recuperar» o que você perdeu — costuma ser o segundo golpe, aplicado na mesma lista '+
   'de vítimas.</div>'},

/* ---------------- trabalho e direitos ---------------- */
{id:'decimo', c:'trabajo', t:'13º salário: quando cai e quanto é',
 k:'13 decimo terceiro salario natal parcela novembro dezembro',
 r:'Em duas parcelas: até 30 de novembro e até 20 de dezembro. A segunda vem com os descontos.',
 b:'<p>O 13º é um salário extra por ano, proporcional aos meses trabalhados (1/12 por mês com pelo menos 15 dias).</p>'+
   '<p><b>Primeira parcela:</b> até 30 de novembro, metade do salário, <b>sem descontos</b>.<br>'+
   '<b>Segunda parcela:</b> até 20 de dezembro, com INSS e IR descontados do total — por isso ela sempre vem '+
   'menor do que a pessoa espera.</p>'+
   '<p>É a melhor oportunidade do ano para dar um golpe numa dívida cara ou encher a reserva de uma vez. '+
   'O problema é que ele chega junto com as festas e some.</p>'+
   '<div class="tip">Registre no My Wallet com a categoria <b>13º salário</b>, não como salário. Senão o plano '+
   'acha que você ganha isso todo mês e todas as contas ficam otimistas demais.</div>'},

{id:'fgts', c:'trabajo', t:'FGTS: o que é e quando dá para sacar',
 k:'fgts fundo garantia saque aniversario rescisao 8% conta vinculada',
 r:'8% do salário depositado pelo empregador. Saca na demissão sem justa causa, na casa própria e em alguns outros casos.',
 b:'<p>Todo mês o empregador deposita <b>8% do seu salário</b> numa conta em seu nome na Caixa. O dinheiro é seu, '+
   'mas com regras de saque.</p>'+
   '<p><b>Quando dá para sacar:</b> demissão sem justa causa (com multa de 40% por cima), aposentadoria, compra '+
   'da casa própria, doença grave, e alguns casos específicos.</p>'+
   '<p><b>Saque-aniversário:</b> permite tirar uma parte todo ano, no mês do seu aniversário. Mas quem adere '+
   '<b>perde o direito de sacar o saldo na demissão</b> — só recebe a multa de 40%. Pense duas vezes: é justamente '+
   'na demissão que você mais precisa.</p>'+
   '<div class="alerta">O FGTS rende 3% ao ano mais TR — bem menos que a inflação em muitos anos. Ou seja, '+
   'ele perde valor parado. Isso não é motivo para sacar por sacar, mas é motivo para não tratá-lo como investimento.</div>'},

{id:'ferias', c:'trabajo', t:'Férias: o terço e a venda de dias',
 k:'ferias terco constitucional vender dias abono pecuniario 30 dias',
 r:'30 dias por ano, com um terço a mais. Dá para vender até 10 dias.',
 b:'<p>Depois de 12 meses você tem direito a <b>30 dias de férias</b>, pagos com um adicional de <b>1/3</b> '+
   '(o «terço constitucional»).</p>'+
   '<p><b>Vender dias:</b> dá para converter até 10 dias em dinheiro (o «abono pecuniário»). Você recebe por eles '+
   'e trabalha normalmente.</p>'+
   '<p><b>Parcelamento:</b> desde 2017 as férias podem ser divididas em até 3 períodos, sendo um deles de no mínimo '+
   '14 dias e os outros de no mínimo 5.</p>'+
   '<p>O pagamento tem que sair <b>até 2 dias antes</b> do início das férias.</p>'},

{id:'clt-pj-mei', c:'trabajo', t:'CLT, PJ ou MEI: o que muda no seu bolso',
 k:'clt pj mei autonomo carteira assinada comparar quanto vale',
 r:'PJ paga mais na conta, mas você banca 13º, férias, FGTS e INSS sozinho.',
 b:'<p>Comparar o valor bruto é o erro clássico. Um PJ de <span class="num">R$ 8.000</span> não é melhor que '+
   'uma CLT de <span class="num">R$ 6.000</span> automaticamente.</p>'+
   '<p><b>O que a CLT te dá além do salário:</b> 13º (8,3% a mais por ano), férias com 1/3 (11% a mais), '+
   'FGTS (8%), multa de 40% se for demitido, seguro-desemprego, INSS pago em parte pela empresa, '+
   'e estabilidade em caso de doença ou gravidez.</p>'+
   '<p>Somando, a CLT vale perto de <b>30% a mais</b> do que o salário nominal. Um PJ precisa ganhar bem acima '+
   'disso para empatar — e ainda paga contador, impostos e o próprio INSS.</p>'+
   '<p><b>MEI:</b> limite de faturamento anual, imposto fixo mensal baixo, e dá direito a aposentadoria e '+
   'auxílio-doença. É a melhor porta de entrada para quem trabalha por conta.</p>'},

{id:'inss', c:'trabajo', t:'INSS: quanto desconta e para que serve',
 k:'inss desconto aposentadoria contribuicao autonomo previdencia publica',
 r:'De 7,5% a 14% do salário, por faixas. Garante aposentadoria, auxílio-doença e mais.',
 b:'<p>O desconto é progressivo por faixas (de 7,5% a 14%), aplicado como imposto de renda: cada faixa incide só '+
   'sobre a parte do salário dentro dela. Por isso a alíquota efetiva é sempre menor que a da faixa mais alta.</p>'+
   '<p>Dá direito a: aposentadoria, auxílio-doença, auxílio-acidente, salário-maternidade e pensão por morte '+
   'para a família.</p>'+
   '<p><b>Autônomo e MEI:</b> o MEI recolhe um valor fixo baixo por mês (dentro do DAS) e já garante os benefícios, '+
   'com aposentadoria no valor de um salário mínimo. Quem quer mais precisa complementar.</p>'+
   '<div class="tip">Confira seu histórico no app <b>Meu INSS</b>. Períodos sem recolhimento aparecem lá, e '+
   'descobrir isso aos 60 é tarde demais.</div>'},

{id:'rescisao', c:'trabajo', t:'Fui demitido: o que eu tenho a receber',
 k:'rescisao demissao sem justa causa acerto verbas multa 40% aviso previo',
 r:'Saldo de salário, aviso prévio, férias e 13º proporcionais, FGTS com multa de 40% e seguro-desemprego.',
 b:'<p>Na <b>demissão sem justa causa</b> você recebe:</p>'+
   '<p>• Saldo de salário dos dias trabalhados<br>'+
   '• Aviso prévio (30 dias, mais 3 por ano trabalhado, até 90)<br>'+
   '• Férias vencidas e proporcionais, com 1/3<br>'+
   '• 13º proporcional<br>'+
   '• Saque do FGTS + <b>multa de 40%</b> sobre o saldo<br>'+
   '• Direito ao seguro-desemprego</p>'+
   '<p><b>Se você pede demissão:</b> perde a multa de 40%, o saque do FGTS e o seguro-desemprego. '+
   'Recebe saldo, férias e 13º proporcionais.</p>'+
   '<p><b>Acordo (demissão consensual):</b> metade do aviso, metade da multa, saque de 80% do FGTS e '+
   '<b>sem</b> seguro-desemprego.</p>'+
   '<div class="tip">O pagamento tem que sair em <b>10 dias</b> a partir do fim do contrato. Atrasou? '+
   'A empresa deve multa de um salário.</div>'},

/* ---------------- hábitos ---------------- */
{id:'anotar', c:'habitos', t:'Registrar na hora, não no domingo',
 k:'anotar registrar habito esquecer lembrar todo dia rotina',
 r:'Cinco segundos na hora valem mais que uma hora no fim de semana.',
 b:'<p>O que derruba quase todo mundo não é a falta de disciplina, é a distância entre o gasto e o registro. '+
   'No domingo você já não lembra do que gastou na terça — e o que não é lembrado não é registrado.</p>'+
   '<p><b>Registre na hora do pagamento.</b> Pagou o almoço, lança. São cinco segundos, e o valor está exato '+
   'na sua frente.</p>'+
   '<p>Se não der, o segundo melhor é um alarme no mesmo horário toda noite. O que não funciona é «faço no fim de '+
   'semana».</p>'+
   '<div class="tip">Ponha o My Wallet na primeira tela do celular, junto com o app do banco. Distância é o '+
   'inimigo do hábito.</div>'},

{id:'impulso', c:'habitos', t:'Compras por impulso: a regra das 24 horas',
 k:'impulso comprar sem pensar desejo promocao arrependimento',
 r:'Espere um dia antes de qualquer compra não planejada. Boa parte da vontade passa.',
 b:'<p>Compra por impulso não é falta de caráter: é o resultado de um sistema desenhado para isso — '+
   'um clique, um cupom que expira, o frete grátis que falta pouco para atingir.</p>'+
   '<p><b>A regra das 24 horas:</b> qualquer compra não planejada acima de um valor que você define '+
   '(<span class="num">R$ 100</span>, por exemplo) espera um dia. Boa parte do desejo evapora sozinho, e o que '+
   'sobrevive costuma ser uma compra que valia mesmo.</p>'+
   '<p><b>Tire o cartão dos sites.</b> Ter que levantar e buscar o cartão é atrito suficiente para a maioria '+
   'das compras impulsivas.</p>'},

{id:'assinaturas', c:'habitos', t:'As assinaturas que você esqueceu que tem',
 k:'assinatura streaming mensalidade recorrente esqueci cancelar academia',
 r:'Some todas e multiplique por 12. O número costuma assustar.',
 b:'<p>Streaming, nuvem, academia que você não vai, aquele app que você testou uma vez. Cada uma parece pequena, '+
   'e é exatamente por isso que ninguém cancela.</p>'+
   '<p><b>Faça isto hoje:</b> abra a fatura do cartão e marque toda cobrança que se repete. Some. Multiplique '+
   'por 12. Esse é o preço anual de coisas que você pode nem estar usando.</p>'+
   '<p>Cancele o que você não usou no último mês. Se sentir falta, assina de novo — leva dois minutos.</p>'+
   '<div class="tip">Cadastre as que sobrarem como <b>conta fixa</b> no My Wallet. Assim elas param de ser '+
   'invisíveis e passam a aparecer no seu mês.</div>'},

{id:'mes-ruim', c:'habitos', t:'Um mês ruim não apaga os bons',
 k:'desisti falhei mes ruim recomecar culpa desanimo parei',
 r:'Vai acontecer. Retome de hoje, sem tentar reconstruir o que faltou.',
 b:'<p>Vai ter mês em que você desorganiza tudo: uma viagem, uma emergência, uma fase ruim. Acontece com todo mundo.</p>'+
   '<p><b>Não tente reconstruir o que faltou.</b> Tentar lembrar duas semanas de gastos é chato o bastante para '+
   'fazer você largar o app de vez. Retome de hoje e pronto.</p>'+
   '<p>O único hábito que faz mal de verdade é <b>parar de olhar os números quando as coisas apertam</b> — '+
   'que é justamente quando eles são mais úteis.</p>'+
   '<div class="tip">Se o saldo do app se afastou do banco, use <b>Mais → Corrigir meu ponto de partida</b> '+
   'e siga em frente. Perfeição não é o objetivo.</div>'},

{id:'metas-nome', c:'habitos', t:'Guardar sem objetivo quase nunca dá certo',
 k:'meta objetivo nome poupar sem motivo desanimo motivacao',
 r:'Dinheiro com nome e data é muito mais difícil de gastar.',
 b:'<p>«Vou guardar por guardar» dura pouco: na primeira vontade, esse dinheiro é o primeiro a ir, porque não está '+
   'defendendo nada.</p>'+
   '<p>Dê nome e data: «viagem em julho», «notebook até março», «entrada do apê em dois anos». Aí gastar deixa de '+
   'ser uma escolha neutra e passa a ser trocar uma coisa por outra — e isso muda a decisão.</p>'+

/* ---------- busca: sem acento, sem maiuscula ---------- */
function norm(s){
  s=String(s==null?'':s).toLowerCase();
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){}
  return s.replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
ARTS.forEach(function(a){ a._t=norm(a.t); a._k=norm(a.k); a._r=norm(a.r); a._b=norm(a.b); });
