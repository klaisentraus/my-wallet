<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="My Wallet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<title>My Wallet</title>
<style>
:root{
  --bg:#f4f3ee; --surface:#ffffff; --surface2:#faf9f5; --sunken:#eeece4;
  --text:#1b1a17; --muted:#6f6d64; --faint:#9a978c; --line:#e4e1d7;
  --accent:#0d7a6f; --accent-ink:#065048; --accent-soft:#dcefea;
  --in:#0d7a6f; --in-soft:#dcefea;
  --out:#c25239; --out-soft:#fbe5df;
  --save:#8a6bc4; --save-soft:#ece4f8;
  --warn:#a8711a; --warn-soft:#fbeed6;
  --danger:#b23b30;
  --r:16px; --r-sm:11px; --r-lg:22px;
  --shadow:0 1px 2px rgba(24,22,17,.05), 0 6px 18px -8px rgba(24,22,17,.16);
  --on-accent:#ffffff;
  --cat:#1b1b24; --cat-paw:#2f2f3c; --cat-ear:#e8aab4; --cat-nose:#e2899b;
  --cat-eye:#f4b73f; --cat-line:#cfccc3; --cat-halo:#e9e5d9; --cat-rim:transparent;
  --accent-lift:#13a191; --fab-glow:13,122,111;
  --nav-h:66px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --surface:#1d2026; --surface2:#22252c; --sunken:#282c34;
    --text:#eceae4; --muted:#a2a49e; --faint:#75776f; --line:#2f333b;
    --accent:#4ec5b2; --accent-ink:#a9e5db; --accent-soft:#17342f;
    --in:#4ec5b2; --in-soft:#17342f;
    --out:#f08a6c; --out-soft:#3a231c;
    --save:#b79df0; --save-soft:#2a2338;
    --warn:#e0aa54; --warn-soft:#372a15;
    --danger:#f0796a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
    --on-accent:#06231f;
    --cat:#0e0e15; --cat-paw:#20202b; --cat-ear:#c98d98; --cat-nose:#c47b8c;
    --cat-eye:#f4b73f; --cat-line:#7e7b74; --cat-halo:#272b34; --cat-rim:rgba(255,255,255,.55);
    --accent-lift:#74dbc9; --fab-glow:78,197,178;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1d2026; --surface2:#22252c; --sunken:#282c34;
  --text:#eceae4; --muted:#a2a49e; --faint:#75776f; --line:#2f333b;
  --accent:#4ec5b2; --accent-ink:#a9e5db; --accent-soft:#17342f;
  --in:#4ec5b2; --in-soft:#17342f;
  --out:#f08a6c; --out-soft:#3a231c;
  --save:#b79df0; --save-soft:#2a2338;
  --warn:#e0aa54; --warn-soft:#372a15;
  --danger:#f0796a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
  --on-accent:#06231f;
  --cat:#0e0e15; --cat-paw:#20202b; --cat-ear:#c98d98; --cat-nose:#c47b8c;
  --cat-eye:#f4b73f; --cat-line:#7e7b74; --cat-halo:#272b34; --cat-rim:rgba(255,255,255,.55);
  --accent-lift:#74dbc9; --fab-glow:78,197,178;
  color-scheme:dark;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* sin zoom: ni de dos dedos, ni de doble toque, ni al entrar a un campo */
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;
  touch-action:pan-x pan-y; overscroll-behavior:none}
/* el texto de la interfaz no se selecciona al dejar el dedo puesto;
   lo que si se puede copiar son los campos y el contenido de Aprender */
body{touch-action:pan-x pan-y; overscroll-behavior:none;
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
input,textarea,select,.art .ab,.disc{-webkit-user-select:text; user-select:text;
  -webkit-touch-callout:default}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
/* piso de 16px: por debajo de eso iOS acerca la pantalla al entrar a un campo */
input,textarea,select{font-size:16px}
button{cursor:pointer; border:none; background:none; padding:0}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- shell ---------- */
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative}
.screen{display:none; padding:0 16px calc(var(--nav-h) + 96px); animation:fade .22s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}

.top{padding:calc(env(safe-area-inset-top) + 18px) 0 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.top h1{font-size:25px; line-height:1.15; letter-spacing:-.02em; font-weight:680}
/* o saludo leva o nombre, asi que se ajusta al ancho en vez de partirse en dos */
#saludo{font-size:clamp(18px, 5.4vw, 25px); text-wrap:balance}
.top .sub{font-size:12.5px; color:var(--muted); margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;flex:none;box-shadow:var(--shadow)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); margin-bottom:12px}
.card.flat{box-shadow:none; background:var(--surface2)}
.card h3{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:650; margin-bottom:10px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.s12{font-size:12.5px} .s13{font-size:13.5px} .s14{font-size:14px}
.mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px} .mt20{margin-top:20px}
.center{text-align:center}

/* ---------- hero ---------- */
.hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 18px; box-shadow:var(--shadow); margin-bottom:12px}
.hero .lbl{font-size:12.5px; color:var(--muted); font-weight:560}
.hero .big{font-size:38px; font-weight:700; letter-spacing:-.03em; line-height:1.08; margin:5px 0 2px}
.hero .big.neg{color:var(--out)}
.hero .note{font-size:13px; color:var(--muted)}
.split{display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line); border-radius:var(--r-sm); overflow:hidden; margin-top:16px}
.split>div{background:var(--surface); padding:11px 8px; text-align:center}
.split .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:640}
.split .v{font-size:15px; font-weight:670; margin-top:3px; letter-spacing:-.01em}
.v.in{color:var(--in)} .v.out{color:var(--out)} .v.save{color:var(--save)}

.bar{height:9px; border-radius:99px; background:var(--sunken); overflow:hidden; display:flex}
.bar i{display:block; height:100%}
/* un significado, un color en toda la app: verde indispensable, naranja recortable,
   morado ahorro. (.c es para barras de avance, no para gastos.) */
.bar i.a{background:var(--accent)} .bar i.b{background:var(--save)} .bar i.c{background:var(--accent)}
/* lo comprometido que aun no sale: rayado, para que no se lea como gastado */
.bar i.pend-seg{background:repeating-linear-gradient(135deg,var(--warn) 0 4px,transparent 4px 8px);
  box-shadow:inset 0 0 0 1px var(--warn)}

button.lnk{color:var(--accent); font-weight:650; text-decoration:underline;
  text-underline-offset:2px; font-size:inherit}

/* ---------- daily pace ---------- */
.pace{display:flex; align-items:baseline; gap:8px; margin-top:4px}
.pace b{font-size:26px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; flex:none}

/* ---------- lists ---------- */
.item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--sunken)}
.ic.in{background:var(--in-soft)} .ic.out{background:var(--out-soft)} .ic.save{background:var(--save-soft)}
.item .nm{font-weight:570; font-size:14.5px}
.item .dt{font-size:12px; color:var(--faint); margin-top:1px}
.item .amt{margin-left:auto; font-weight:650; font-size:15px; white-space:nowrap; letter-spacing:-.01em}
.amt.in{color:var(--in)} .amt.out{color:var(--out)} .amt.save{color:var(--save)}

.catrow{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.catrow .e{width:26px; text-align:center; font-size:15px; flex:none}
.catrow .g{flex:1; min-width:0}
.catrow .t{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px; gap:8px}
.catrow .t span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.catrow .t b{font-weight:640; white-space:nowrap}
.mini{height:6px; border-radius:99px; background:var(--sunken); overflow:hidden}
.mini i{display:block;height:100%; background:var(--warn); border-radius:99px}
.mini i.ess{background:var(--accent)}

/* ---------- buttons ---------- */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 16px;
  border-radius:13px; background:var(--accent); color:var(--on-accent); font-weight:640; font-size:15px; text-align:center}
.btn.ghost{background:var(--surface); border:1px solid var(--line); color:var(--text)}
.btn.soft{background:var(--accent-soft); color:var(--accent-ink)}
.btn.sm{padding:10px 14px; font-size:14px; border-radius:11px; width:auto}
.btn:active{transform:scale(.985)}
.btnrow{display:flex; gap:9px}
.btnrow>*{flex:1}

/* 5 filtros tienen que caber en 375px sin tener que deslizar */
.chip{padding:7px 10px; border-radius:99px; background:var(--surface); border:1px solid var(--line);
  font-size:13px; font-weight:560; white-space:nowrap}
.chip.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.chips{display:flex; gap:5px; overflow-x:auto; padding:2px 0 6px;
  scrollbar-width:none; -ms-overflow-style:none; overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}

/* ---------- fab + nav ---------- */
.fab{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  width:60px; height:60px; border-radius:50%; z-index:40;
  background:linear-gradient(152deg, var(--accent-lift) 0%, var(--accent) 62%);
  color:var(--on-accent); display:grid; place-items:center;
  box-shadow:
    0 1px 2px rgba(var(--fab-glow),.30),
    0 6px 14px -3px rgba(var(--fab-glow),.42),
    0 14px 30px -10px rgba(var(--fab-glow),.55),
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 0 0 1px rgba(255,255,255,.10);
  transition:transform .15s cubic-bezier(.3,.8,.3,1), box-shadow .15s ease}
.fab svg{width:23px; height:23px; display:block}
.fab:active{transform:translateX(-50%) scale(.92);
  box-shadow:0 1px 2px rgba(var(--fab-glow),.35), 0 4px 10px -3px rgba(var(--fab-glow),.45),
             inset 0 1px 0 rgba(255,255,255,.18)}
nav{position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom); background:var(--surface); border-top:1px solid var(--line);
  display:flex; z-index:30}
nav .in{max-width:520px; margin:0 auto; width:100%; display:grid; grid-template-columns:repeat(5,1fr)}
nav button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:var(--nav-h); color:var(--faint); font-size:10px; font-weight:580}
nav button .e{font-size:19px; line-height:1; filter:grayscale(1); opacity:.6}
nav button.on{color:var(--accent)} nav button.on .e{filter:none; opacity:1}

/* ---------- sheet ---------- */
.scrim{position:fixed; inset:0; background:rgba(15,14,11,.5); z-index:50; opacity:0; pointer-events:none; transition:opacity .22s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--bg);
  border-radius:24px 24px 0 0; max-width:520px; margin:0 auto; transform:translateY(102%);
  transition:transform .28s cubic-bezier(.32,.72,0,1); max-height:94vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
/* la barrita de arriba cierra la ficha: un toque, o arrastrándola hacia abajo */
.sheet .cab{position:relative; flex:none; height:44px; touch-action:none; cursor:grab}
.sheet .cab:active{cursor:grabbing}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line); margin:12px auto 0; flex:none;
  transition:background .15s}
.sheet .cab:active .grab{background:var(--muted)}
/* nada de arrastar la ficha de lado: aquí solo se sube y se baja, como en el resto */
.sheet .body{overflow-y:auto; overflow-x:hidden; touch-action:pan-y;
  padding:4px 16px 18px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
.sheet h2{font-size:18px; font-weight:670; letter-spacing:-.01em}

/* ---------- keypad ---------- */
.seg{display:flex; gap:4px; background:var(--sunken); padding:4px; border-radius:12px; margin-bottom:14px}
.seg button{flex:1; padding:9px 4px; border-radius:9px; font-size:13.5px; font-weight:620; color:var(--muted)}
.seg button.on{background:var(--surface); box-shadow:var(--shadow)}
.seg button.on[data-t="in"]{color:var(--in)}
.seg button.on[data-t="out"]{color:var(--out)}
.seg button.on[data-t="save"]{color:var(--save)}
.amount{text-align:center; padding:6px 0 12px}
.amount .v{font-size:40px; font-weight:700; letter-spacing:-.03em; line-height:1.1}
.amount .v.zero{color:var(--faint)}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px}
.pad button{height:52px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
  font-size:21px; font-weight:560; display:grid; place-items:center; box-shadow:var(--shadow)}
.pad button.sec{font-size:15px; font-weight:620; color:var(--muted); background:var(--surface2)}
.pad button:active{background:var(--sunken)}
.catgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:4px}
.catgrid button{padding:9px 3px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9.5px; line-height:1.2; color:var(--muted);
  text-align:center; font-weight:560; min-height:60px; justify-content:center}
.catgrid button .e{font-size:19px; line-height:1}
.catgrid button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}

label.f{display:block; font-size:12px; color:var(--muted); font-weight:600; margin:12px 0 5px}
input.f, select.f, textarea.f{width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); font-size:16px; outline:none}
input.f:focus, select.f:focus, textarea.f:focus{border-color:var(--accent)}
/* en iOS input[type=date] trae un ancho propio que no se encoge: sin esto se sale de la ficha */
input.f[type="date"]{-webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%}
input.f[type="date"]::-webkit-date-and-time-value{text-align:left; margin:0}
textarea.f{min-height:88px; resize:vertical; font-size:16px; line-height:1.4;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- misc ---------- */
.banner{display:flex; gap:11px; align-items:flex-start; padding:13px 14px; border-radius:var(--r); margin-bottom:12px; font-size:13.5px; line-height:1.45}
.banner.warn{background:var(--warn-soft); color:var(--warn)}
.banner.bad{background:var(--out-soft); color:var(--out)}
.banner.ok{background:var(--accent-soft); color:var(--accent-ink)}
.banner b{font-weight:680}
.banner .e{font-size:17px; line-height:1.2; flex:none}
.banner button{text-decoration:underline; font-weight:650; color:inherit; font-size:13px; margin-top:5px; display:block}

.step{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .n{width:25px;height:25px;border-radius:50%;background:var(--sunken); color:var(--muted);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none; margin-top:1px}
.step.done .n{background:var(--accent); color:var(--on-accent)}
.step.now .n{background:var(--warn); color:#fff}
.step .ti{font-weight:620; font-size:14.5px}
.step.done .ti{color:var(--muted)}
.step .de{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.45}
.step .pill{display:inline-block; margin-top:6px; padding:3px 9px; border-radius:99px; background:var(--warn-soft);
  color:var(--warn); font-size:11.5px; font-weight:680}

.goal{padding:13px 0; border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none}
.goal .hd{display:flex; align-items:center; gap:9px; margin-bottom:7px}
.goal .hd .e{font-size:18px}
.goal .hd .nm{font-weight:620; font-size:14.5px; flex:1}
.goal .hd .pc{font-size:12.5px; color:var(--muted); font-weight:640}
.goal .ft{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; gap:8px}

.opt{border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; background:var(--surface)}
.opt .hd{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.opt .hd .e{font-size:20px}
.opt .hd .nm{font-weight:660; font-size:15px}
.opt .tag{margin-left:auto; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em}
.opt .tag.low{background:var(--accent-soft); color:var(--accent-ink)}
.opt .tag.mid{background:var(--warn-soft); color:var(--warn)}
.opt .tag.high{background:var(--out-soft); color:var(--out)}
.opt p{font-size:13px; color:var(--muted); line-height:1.5}
.opt dl{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:9px 0 0; font-size:12.5px}
.opt dt{color:var(--faint); font-weight:600} .opt dd{margin:0; font-weight:560}

.kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; gap:12px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:650; white-space:nowrap}
.kv.big b{font-size:17px; color:var(--accent)}

.toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(var(--nav-h) + 84px);
  background:var(--text); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:600;
  z-index:90; opacity:0; pointer-events:none; transition:.25s; max-width:88%; text-align:center}
.toast.on{opacity:1; transform:translateX(-50%)}

.empty{text-align:center; padding:36px 20px; color:var(--muted)}
.empty .e{font-size:38px; display:block; margin-bottom:10px; opacity:.75}
.empty p{font-size:13.5px; line-height:1.55; margin-top:5px}

.trend{display:flex; align-items:flex-end; gap:5px; height:60px; margin-top:10px}
.trend .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; height:100%}
.trend .col .b1{background:var(--out-soft); border-radius:3px 3px 0 0; min-height:2px}
.trend .col .b2{background:var(--in-soft); border-radius:3px 3px 0 0; min-height:2px}
.trendlbl{display:flex; gap:5px; margin-top:5px}
.trendlbl div{flex:1; text-align:center; font-size:9.5px; color:var(--faint); text-transform:uppercase; font-weight:620}

.disc{font-size:11.5px; color:var(--faint); line-height:1.55; padding:14px 2px 0}
details.acc{border-top:1px solid var(--line); padding:12px 0}
details.acc summary{font-weight:600; font-size:14px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:'+'; color:var(--muted); font-size:18px; font-weight:400}
details.acc[open] summary::after{content:'–'}
details.acc .c{font-size:13px; color:var(--muted); line-height:1.6; padding-top:9px}
details.acc .c p+p{margin-top:8px}
details.acc .c b{color:var(--text)}

.swipe{display:flex; gap:8px; margin-top:10px}
.swipe button{flex:1; padding:9px; border-radius:10px; background:var(--surface2); border:1px solid var(--line); font-size:13px; font-weight:600}
.swipe button.del{color:var(--danger)}
/* ================= gatinhos pretos ================= */
.cat{display:block; width:100%; height:auto}
.catwrap{display:flex; justify-content:center; margin:0 auto}
.cat-xs{width:22px;height:22px;flex:none}
.cat-sm{width:44px;height:44px;flex:none}
.cat-md{width:96px}
.cat-lg{width:132px}
/* gato preto sobre fundo escuro precisa de contorno de luz */
:root[data-theme="dark"] .cat{filter:drop-shadow(0 0 1.6px var(--cat-rim)) drop-shadow(0 0 7px rgba(255,255,255,.10))}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .cat{filter:drop-shadow(0 0 1.6px var(--cat-rim)) drop-shadow(0 0 7px rgba(255,255,255,.10))}
}
:root[data-theme="light"] .cat{filter:none}

.catstage{position:relative; display:grid; place-items:center; padding:6px 0 2px}
.catstage::before{content:''; position:absolute; width:118px; height:118px; border-radius:50%;
  background:var(--cat-halo); z-index:0}
.catstage .cat{position:relative; z-index:1}

/* gato espiando por cima de um card */

.pawline{display:flex; align-items:center; gap:7px; color:var(--faint)}
.pawline svg{width:14px;height:14px;flex:none}

/* ================= aprender ================= */
.searchbar{position:relative; margin-bottom:12px}
.searchbar input{width:100%; padding:14px 44px 14px 44px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); font-size:16px; outline:none; box-shadow:var(--shadow)}
.searchbar input:focus{border-color:var(--accent)}
.searchbar .mag{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--faint)}
.searchbar .clr{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px;
  border-radius:50%; display:none; place-items:center; color:var(--muted); background:var(--sunken)}
.searchbar .clr svg{width:14px;height:14px}
.searchbar.has .clr{display:grid}

.art{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:9px;
  box-shadow:var(--shadow); overflow:hidden}
.art>summary{list-style:none; cursor:pointer; padding:14px 15px; display:flex; gap:11px; align-items:flex-start}
.art>summary::-webkit-details-marker{display:none}
.art .qi{width:26px;height:26px;flex:none;border-radius:8px;background:var(--accent-soft);
  display:grid;place-items:center;color:var(--accent-ink)}
.art .qi svg{width:15px;height:15px}
.art .qt{flex:1; min-width:0}
.art .qt b{display:block; font-weight:640; font-size:14.5px; line-height:1.35}
.art .qt span{display:block; font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45}
.art .chev{color:var(--faint); font-size:19px; line-height:1; margin-top:2px; flex:none; transition:transform .2s}
.art[open] .chev{transform:rotate(45deg)}
.art .ab{padding:2px 15px 16px; font-size:13.5px; line-height:1.65; color:var(--muted)}
.art .ab p{margin:0 0 9px}
.art .ab p:last-child{margin-bottom:0}
.art .ab b{color:var(--text); font-weight:640}
.art .ab ul{margin:0 0 9px; padding-left:18px}
.art .ab li{margin-bottom:5px}
.art .ab .tip{background:var(--accent-soft); color:var(--accent-ink); border-radius:11px; padding:11px 12px; margin:10px 0 0}
.art .ab .tip b{color:var(--accent-ink)}
.art .ab .alerta{background:var(--out-soft); color:var(--out); border-radius:11px; padding:11px 12px; margin:10px 0 0}
.art .ab .alerta b{color:var(--out)}
.art .ab .num{font-variant-numeric:tabular-nums; font-weight:640; color:var(--text)}
.art .goto{display:inline-flex; align-items:center; gap:6px; margin-top:11px; font-size:13px;
  font-weight:640; color:var(--accent); text-decoration:underline; text-underline-offset:3px}

.catcount{font-size:12px; color:var(--faint); margin:2px 0 10px; font-weight:560}
.faqhd{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  font-weight:650; margin:20px 0 10px; display:flex; align-items:center; gap:7px}
.faqhd svg{width:14px;height:14px;color:var(--faint)}

/* ================= navegacao com icones ================= */
nav button .e{display:none}
nav button svg{width:21px;height:21px}
nav button.on svg{color:var(--accent)}
.topbtns{display:flex; gap:8px; align-items:center; flex:none}
.iconbtn svg{width:18px;height:18px;color:var(--muted)}
.iconbtn.on svg{color:var(--accent)}

/* ================= pagos con fecha ================= */
.pend{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:none}
.pend .pd{flex:1; min-width:0}
.pend .nm{font-weight:570; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pend .dt{font-size:12px; margin-top:2px; font-weight:620; line-height:1.35}
.pend .pa{font-weight:650; font-size:15px; white-space:nowrap; letter-spacing:-.01em}
.pend.ok .nm,.pend.ok .pa{color:var(--faint); text-decoration:line-through}
.pend .pb{padding:8px 14px; border-radius:99px; background:var(--accent); color:var(--on-accent);
  font-size:12.5px; font-weight:650; flex:none}
.pend .pb.done{background:transparent; color:var(--accent); font-size:17px; padding:6px 8px}
.pend .pd{cursor:pointer}
.ed{color:var(--faint); font-weight:400; font-size:15px; vertical-align:1px}
.item .nm .ed,.goal .nm .ed{margin-left:2px}
.pend .pb:active{transform:scale(.96)}

.pxw{display:block; position:relative; flex:none}
:root[data-theme="dark"] .px, :root:not([data-theme="light"]) .px{filter:none}
.px-idle{--row:0; animation:px_idle 1.4s steps(1,end) infinite}
@keyframes px_idle{0%{background-position-x:-0px}16.6667%{background-position-x:-64px}33.3333%{background-position-x:-128px}50%{background-position-x:-192px}66.6667%{background-position-x:-256px}83.3333%{background-position-x:-320px}}
.px-sleep{--row:1; animation:px_sleep 2.4s steps(1,end) infinite}
@keyframes px_sleep{0%{background-position-x:-0px}25%{background-position-x:-64px}50%{background-position-x:-128px}75%{background-position-x:-192px}}
.px-sad{--row:2; animation:px_sad .7s steps(1,end) infinite}
@keyframes px_sad{0%{background-position-x:-0px}50%{background-position-x:-64px}}
.px-cry{--row:3; animation:px_cry 1.2s steps(1,end) infinite}
@keyframes px_cry{0%{background-position-x:-0px}25%{background-position-x:-64px}50%{background-position-x:-128px}75%{background-position-x:-192px}}
.px-happy{--row:4; animation:px_happy 1.1s steps(1,end) infinite}
@keyframes px_happy{0%{background-position-x:-0px}16.6667%{background-position-x:-64px}33.3333%{background-position-x:-128px}50%{background-position-x:-192px}66.6667%{background-position-x:-256px}83.3333%{background-position-x:-320px}}
.px-excited{--row:5; animation:px_excited .7s steps(1,end) infinite}
@keyframes px_excited{0%{background-position-x:-0px}33.3333%{background-position-x:-64px}66.6667%{background-position-x:-128px}}
.px-dance{--row:6; animation:px_dance .7s steps(1,end) infinite}
@keyframes px_dance{0%{background-position-x:-0px}25%{background-position-x:-64px}50%{background-position-x:-128px}75%{background-position-x:-192px}}
.px-chill{--row:7; animation:px_chill 1.8s steps(1,end) infinite}
@keyframes px_chill{0%{background-position-x:-0px}16.6667%{background-position-x:-64px}33.3333%{background-position-x:-128px}50%{background-position-x:-192px}66.6667%{background-position-x:-256px}83.3333%{background-position-x:-320px}}
.px-tickle{--row:8; animation:px_tickle .9s steps(1,end) infinite}
@keyframes px_tickle{0%{background-position-x:-0px}25%{background-position-x:-64px}50%{background-position-x:-128px}75%{background-position-x:-192px}}
.px-box{--row:9; animation:px_box 1.6s steps(1,end) infinite}
@keyframes px_box{0%{background-position-x:-0px}16.6667%{background-position-x:-64px}33.3333%{background-position-x:-128px}50%{background-position-x:-192px}66.6667%{background-position-x:-256px}83.3333%{background-position-x:-320px}}
.px-run{--row:10; animation:px_run .55s steps(1,end) infinite}
@keyframes px_run{0%{background-position-x:-0px}16.6667%{background-position-x:-64px}33.3333%{background-position-x:-128px}50%{background-position-x:-192px}66.6667%{background-position-x:-256px}83.3333%{background-position-x:-320px}}
.px-jump{--row:11; animation:px_jump 1.1s steps(1,end) infinite}
@keyframes px_jump{0%{background-position-x:-0px}16.6667%{background-position-x:-64px}33.3333%{background-position-x:-128px}50%{background-position-x:-192px}66.6667%{background-position-x:-256px}83.3333%{background-position-x:-320px}}
/* el gatito vive fijo abajo a la izquierda: la misma esquina en todas las pestañas */
#pet{position:fixed; left:0; z-index:22; pointer-events:none; will-change:transform;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 2px)}
#pet i{pointer-events:auto; cursor:pointer}
#pet i.izq{transform:scaleX(-1)}
#pet .msg{position:absolute; bottom:80px; left:8px; width:max-content; max-width:62vw;
  background:var(--text); color:var(--bg); padding:9px 12px; border-radius:12px;
  font-size:12.5px; line-height:1.45; box-shadow:var(--shadow); display:none}
#pet .msg.on{display:block; animation:burbIn .2s ease}
#pet .msg b{font-weight:700}
@media (prefers-reduced-motion:reduce){ #pet{transition:none!important} }
.gatos{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px}
.gatoOp{display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 2px 8px;
  border-radius:13px; border:1px solid var(--line); background:var(--surface);
  font-size:11px; font-weight:600; color:var(--muted)}
.gatoOp.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
.gatoOp .pxw{pointer-events:none}
/* el halo tiene que caber DENTRO del stage: si se sale, se come el texto de al lado */
.pxstage{position:relative; display:grid; place-items:center; min-height:104px; padding:8px 0 4px}
.pxstage::before{content:''; position:absolute; width:92px; height:92px; border-radius:50%;
  background:var(--cat-halo)}
.pxstage .pxw{position:relative}
.pet{background:none; border:none; padding:0; display:block; cursor:pointer}
.pet .pxw{transition:transform .12s}
.pet:active .pxw{transform:translateY(3px)}
@keyframes petSalta{0%,100%{transform:translateY(0)}35%{transform:translateY(-11px)}70%{transform:translateY(0)}}
.pet .pxw.salta{animation:petSalta .5s ease}
.burbuja{position:relative; background:var(--sunken); border-radius:13px; padding:11px 13px;
  margin-top:14px; font-size:13.5px; line-height:1.5; color:var(--text); animation:burbIn .22s ease}
.burbuja::after{content:''; position:absolute; top:-5px; right:36px; width:11px; height:11px;
  background:var(--sunken); transform:rotate(45deg)}
.burbuja b{font-weight:680}
@keyframes burbIn{from{opacity:0; transform:translateY(-5px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  .px{animation:none!important} .pet .pxw.salta{animation:none}
}
</style>

<script>
/* =========================================================================
   My Wallet — controle de financas pessoais (Brasil)
   Archivo único, funciona sin internet. Datos guardados en el dispositivo.
   ========================================================================= */

var HTML_ORIGINAL = document.documentElement.outerHTML;

/* ---------- referencias de mercado (verificables y editables) ---------- */
/* Referencias do Brasil. Tudo em CENTAVOS. Confira antes de decidir algo:
   estes numeros mudam e sao do momento em que o app foi feito. */
var REF = {
  fecha: 'setembro de 2026',
  inflacion: 4.5,          // IPCA acumulado 12 meses (referencia)
  selic: 15.0,             // meta Selic a.a. (referencia)
  cdi: 14.9,               // CDI a.a., anda colado na Selic
  poupanca: 7.4,           // poupanca a.a. quando Selic > 8,5%: 0,5% a.m. + TR
  minimo: 162400,          // salario minimo mensal, em centavos (R$ 1.624,00)
  fgc: 25000000,           // FGC: R$ 250.000 por CPF por instituicao, em centavos
  fgcTeto: 100000000,      // teto global de R$ 1 milhao a cada 4 anos
  iofDias: 30,             // IOF regressivo zera depois de 30 dias
  usura: 25                // acima disso a divida e cara (a.a.)
};

var CATS = {
  out:[
    {id:'arriendo',    n:'Moradia',     e:'🏠', ess:true},
    {id:'mercado',     n:'Mercado',     e:'🛒', ess:true},
    {id:'servicios',   n:'Contas de casa',e:'💡', ess:true},
    {id:'transporte',  n:'Transporte',  e:'🚌', ess:true},
    {id:'salud',       n:'Saúde',       e:'💊', ess:true},
    {id:'celular',     n:'Celular / net',e:'📱', ess:true},
    {id:'deudas',      n:'Dívidas',     e:'💳', ess:true},
    {id:'educacion',   n:'Educação',    e:'📚', ess:true},
    {id:'comidas',     n:'Comer fora',  e:'🍔', ess:false},
    {id:'antojos',     n:'Compras',     e:'🛍️', ess:false},
    {id:'salidas',     n:'Lazer',       e:'🎉', ess:false},
    {id:'belleza',     n:'Cuidados',    e:'💅', ess:false},
    {id:'subs',        n:'Assinaturas', e:'📺', ess:false},
    {id:'familia',     n:'Família',     e:'🎁', ess:false},
    {id:'mascota',     n:'Pet',         e:'🐾', ess:false},

  ],
  in:[
    {id:'salario',       n:'Salário',      e:'💼'},

    {id:'prima',         n:'13º salário',  e:'🎊'},
    {id:'cesantias',     n:'FGTS / rescisão',e:'🏦'},
    {id:'ventas',        n:'Vendas',       e:'🏪'},
    {id:'regalo',        n:'Presente',     e:'💝'},
    {id:'rendim',        n:'Rendimentos',  e:'📈'},
    {id:'otros_in',      n:'Outros',       e:'✨'}
  ]
};
var CAT_MAP = {};
CATS.out.concat(CATS.in).forEach(function(c){ CAT_MAP[c.id] = c; });

var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---------- estado ---------- */
var S = null;
var VISTA = { mes: ymHoy(), filtro:'todo', pantalla:'inicio', planTab:'plan' };
/* sube junto con el número de sw.js, para que las dos cosas digan lo mismo */
var APP_VER='v1', APP_FECHA='21 de setembro de 2026';

function estadoNuevo(){
  return {
    v:1, updatedAt:new Date().toISOString(),
    perfil:{ nombre:'Rafael', ingresoEsperado:0, onboarded:false,
             saldoInicial:0, ahorroInicial:0, saldoDesde:null },
    mov:[], metas:[], deudas:[], fijos:[], cobros:[],
    ajustes:{ metaAhorroPct:20, colchonMeses:3, inflacion:REF.inflacion, tema:'auto', gato:0,
              ultimoRespaldo:null, movsDesdeRespaldo:0 }
  };
}

/* ---------- utilidades ---------- */
function ymHoy(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function pad(n){ return (n<10?'0':'')+n; }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* Tudo no app anda em CENTAVOS inteiros. Assim as somas nunca escorregam
   (0,1+0,2) e a aritmetica herdada continua valendo. So aqui vira reais. */
function money(c){
  var v=Math.round(Math.abs(c||0));
  return 'R$ '+(v/100).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
/* sem centavos, para onde eles so fazem ruido */
function moneyR(c){
  var v=Math.round(Math.abs(c||0)/100);
  return 'R$ '+v.toLocaleString('pt-BR');
}
function moneyS(c){ return (c<0?'−':'')+money(c); }
function corto(c){
  var n = Math.abs(Math.round((c||0)/100));      /* reais */
  if(n>=1000000) return 'R$ '+(n/1000000).toFixed(n>=10000000?0:1).replace('.',',')+' mi';
  if(n>=1000) return 'R$ '+(n/1000).toFixed(n>=10000?0:1).replace('.',',')+' mil';
  return 'R$ '+n;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nomMes(ym){ var p=ym.split('-'); return MESES[+p[1]-1]+' de '+p[0]; }
function fechaCorta(iso){
  var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var dif=Math.round((hoy-d)/86400000);
  if(dif===0) return 'Hoje'; if(dif===1) return 'Ontem';
  return +p[2]+' '+MES_C[+p[1]-1].toLowerCase();
}
function diasEnMes(ym){ var p=ym.split('-'); return new Date(+p[0],+p[1],0).getDate(); }
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(e._t); e._t=setTimeout(function(){ e.classList.remove('on'); },2200); }

/* =========================================================================
   ARMAZENAMENTO — tripla camada: localStorage + IndexedDB + semente no HTML
   ========================================================================= */
var LS_KEY='mywallet_v1';
var idb=null;

function abrirIDB(){
  return new Promise(function(res){
    try{
      if(!window.indexedDB) return res(null);
      var r=indexedDB.open('mywallet',1);
      r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ res(null); };
      setTimeout(function(){ res(null); },2500);
    }catch(e){ res(null); }
  });
}
function idbGet(){
  return new Promise(function(res){
    if(!idb) return res(null);
    try{ var t=idb.transaction('kv','readonly').objectStore('kv').get('state');
      t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbPut(o){
  try{ if(idb) idb.transaction('kv','readwrite').objectStore('kv').put(o,'state'); }catch(e){}
}
var STORAGE_OK=true;
function probarAlmacenamiento(){
  try{
    var k='__mp_probe__';
    localStorage.setItem(k,'1');
    var v=localStorage.getItem(k);
    localStorage.removeItem(k);
    return v==='1';
  }catch(e){ return false; }
}
function lsGet(){ try{ var r=localStorage.getItem(LS_KEY)||localStorage.getItem('minhagrana_v1'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsPut(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }
function semilla(){

}
function masNuevo(){

  if(!cs.length) return null;
  cs.sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });
  return cs[0];
}

/* =========================================================================
   CÁLCULOS
   ========================================================================= */
function movsDe(ym){ return S.mov.filter(function(m){ return m.fecha.slice(0,7)===ym; }); }

function resumen(ym){
  var r={ing:0,gas:0,aho:0,ess:0,noEss:0,porCat:{}};
  movsDe(ym).forEach(function(m){
    if(m.tipo==='in'){ r.ing+=m.monto; }
    else if(m.tipo==='save'){ r.aho+=m.monto; }
    else{
      r.gas+=m.monto;
      var c=CAT_MAP[m.cat];
      if(c && c.ess) r.ess+=m.monto; else r.noEss+=m.monto;
      r.porCat[m.cat]=(r.porCat[m.cat]||0)+m.monto;
    }
  });
  r.saldo = r.ing - r.gas - r.aho;
  return r;
}

function mesesConDatos(){
  var s={}; S.mov.forEach(function(m){ s[m.fecha.slice(0,7)]=1; });
  return Object.keys(s).sort();
}
/* promedio de los meses completos anteriores (máx 3); si no hay, usa el mes actual */
function base(){
  var hoy=ymHoy();
  var ms=mesesConDatos().filter(function(m){ return m<hoy; }).slice(-3);
  var ing=0, ess=0, noEss=0, gas=0;
  if(ms.length){
    ms.forEach(function(m){ var r=resumen(m); ing+=r.ing; ess+=r.ess; noEss+=r.noEss; gas+=r.gas; });
    ing/=ms.length; ess/=ms.length; noEss/=ms.length; gas/=ms.length;
  }else{
    var r=resumen(hoy); ing=r.ing; ess=r.ess; noEss=r.noEss; gas=r.gas;
  }
  if(ing<=0 && S.perfil.ingresoEsperado>0) ing=S.perfil.ingresoEsperado;
  return {ing:ing, ess:ess, noEss:noEss, gas:gas, meses:ms.length, estimado:(ms.length===0)};
}

/* cuanta plata tiene disponible AHORA: el corte mas todo lo registrado despues.
   null = todavia no lo ha configurado */
/* Lo que ella pone es una BASE, no una foto que congela: a partir de ahí cada
   cosa que anote mueve el número. Un app donde registrar el sueldo no cambia el
   saldo no sirve para nada. */
function netoMov(){
  var t=0;
  S.mov.forEach(function(m){ t += (m.tipo==='in' ? m.monto : -m.monto); });
  return t;                                     /* gasto o plata apartada restan */
}
function saldoActual(){
  if(!S.perfil.saldoDesde) return null;
  return (S.perfil.saldoInicial||0) + netoMov();
}


function ahorroTotal(){
  var t=S.perfil.ahorroInicial||0;
  S.mov.forEach(function(m){ if(m.tipo==='save') t+=m.monto; }); return t;
}
function colchon(){
  var t=S.perfil.ahorroInicial||0;   /* lo que ya tenia ahorrado antes de empezar */
  S.mov.forEach(function(m){ if(m.tipo==='save' && (!m.destino||m.destino==='colchon')) t+=m.monto; });
  return t;
}
function ahorradoMeta(id){
  var t=0; S.mov.forEach(function(m){ if(m.tipo==='save' && m.destino===id) t+=m.monto; }); return t;
}
function deudasCaras(){ return S.deudas.filter(function(d){ return (d.tasa||0) >= REF.usura; }); }
function totalDeuda(l){ return (l||S.deudas).reduce(function(a,d){ return a+(d.saldo||0); },0); }
function interesMensual(d){ return (d.saldo||0) * (Math.pow(1+(d.tasa||0)/100, 1/12) - 1); }

/* ---- motor del plan: escalera de prioridades ---- */
function plan(){
  var b=base();
  var disponible = b.ing - b.ess - b.noEss;
  var pct = S.ajustes.metaAhorroPct/100;
  var ideal = b.ing * pct;
  var sugerido = Math.max(0, Math.min(ideal, disponible));
  var caras = deudasCaras();
  var col = colchon();
  var colchonMin = 300000;      /* R$ 3.000 em centavos: o primeiro degrau */
  /* sin un mes de gastos no hay como calcularla: 0 significa «todavia no se» */
  var colchonMeta = b.ess>0 ? b.ess * S.ajustes.colchonMeses : 0;

  var pasos=[];
  pasos.push({
    t:'Reserva de emergência', meta:colchonMin, act:Math.min(col,colchonMin),
    d:'R$ 3.000 guardados e disponíveis. É o que impede que um imprevisto — o celular que quebrou, '+
      'uma consulta, o carro na oficina — vire dívida no cartão. Sem isso, qualquer susto vira rotativo.'
  });
  var vivas=S.deudas.filter(function(d){ return (d.saldo||0)>0; });
  pasos.push({
    t: caras.length ? 'Matar as dívidas caras' : 'Suas dívidas',
    meta:totalDeuda(caras), act:0, deuda:true,
    d: caras.length
        ? 'Você tem '+caras.length+' dívida'+(caras.length>1?'s':'')+' acima de '+REF.usura+'% ao ano. '+
          'O rotativo do cartão passa de 400% a.a. e o cheque especial de 130%: nenhum investimento '+
          'legal no Brasil chega perto disso. Pagar é o melhor rendimento que existe para esse dinheiro.'
        : (vivas.length
            ? 'Você deve '+money(totalDeuda(vivas))+' em '+vivas.length+' dívida'+(vivas.length>1?'s':'')+
              ', nenhuma com juro alto. Sem pressa: pague na data e siga para o resto.'
            : 'Nenhuma dívida cadastrada. Se você tem cartão, financiamento, consignado ou deve para '+
              'alguém, cadastre na aba Dívidas que aparece aqui.')
  });
  pasos.push({
    t:'Reserva de '+S.ajustes.colchonMeses+' meses', meta:colchonMeta, act:Math.min(col,colchonMeta),
    d: colchonMeta>0
        ? 'Com '+money(colchonMeta)+' você cobre '+S.ajustes.colchonMeses+' meses dos seus gastos '+
          'indispensáveis. É a sua rede se a renda parar. Deixe onde dá para sacar no mesmo dia: '+
          'Tesouro Selic ou CDB de liquidez diária que pague perto de 100% do CDI.'
        : 'Registre um mês de gastos e eu digo quanto você precisa para cobrir '+S.ajustes.colchonMeses+
          ' meses. É a sua rede se a renda parar.'
  });
  var metasAct = S.metas.filter(function(m){ return ahorradoMeta(m.id) < m.objetivo; });
  pasos.push({
    t: metasAct.length ? 'Suas metas' : 'Ponha uma meta',
    meta: metasAct.reduce(function(a,m){ return a+m.objetivo; },0),
    act: metasAct.reduce(function(a,m){ return a+ahorradoMeta(m.id); },0),
    d: metasAct.length ? 'Viagem, curso, entrada do apartamento, troca de carro: o que você está perseguindo.'
                       : 'Guardar sem nome é difícil. Dê nome e data para o que você quer.'
  });
  pasos.push({
    t:'Longo prazo', meta:0, act:0,
    d:'Com a reserva cheia e sem dívida cara, o que sobra pode ir para prazos mais longos e com mais '+
      'risco. Veja a aba Investir.'
  });

  /* paso actual */
  var idx=0;
  if(col >= colchonMin){
    idx=1;
    if(totalDeuda(caras) <= 0){
      idx=2;
      if(colchonMeta>0 && col >= colchonMeta){
        idx=3;
        if(!metasAct.length || pasos[3].act >= pasos[3].meta) idx=4;
      }
    }
  }
  pasos.forEach(function(p,i){ p.estado = i<idx ? 'done' : (i===idx?'now':''); });

  /* modo rescate */
  var rescate=null;
  if(disponible < 0){
    var r=resumen(VISTA.mes), top=[];
    Object.keys(r.porCat).forEach(function(k){
      var c=CAT_MAP[k]; if(c && !c.ess) top.push({c:c, v:r.porCat[k]});
    });
    top.sort(function(a,b){ return b.v-a.v; });
    rescate={ hueco:-disponible, top:top.slice(0,3) };
  }

  return {b:b, disponible:disponible, ideal:ideal, sugerido:sugerido, pct:pct,
          pasos:pasos, idx:idx, col:col, colchonMin:colchonMin, colchonMeta:colchonMeta,
          caras:caras, rescate:rescate, metasAct:metasAct};
}

  var sa=saldoActual();

        : (pv.porPagar>muestra
            ? 'Não fecha: suas contas com data somam <b>'+money(pv.porPagar)+'</b> e faltam <b>'+
              money(pv.porPagar-muestra)+'</b>.'
            : (pv.porPagar>0
              ? 'Desse tanto, <b>'+money(pv.porPagar)+'</b> já tem dono: são suas contas com data.'
              : (tieneSaldo ? 'Disponível para gastar, sem contar o que você já guardou.'
                            : 'Depois dos seus gastos e do que você guardou.'))))+'</div>'+
      '</div>'+
      '</div>'+
      '<div class="split">'+
        '<div><div class="k">Entrou</div><div class="v in tnum">'+corto(r.ing)+'</div></div>'+
        '<div><div class="k">Gastou</div><div class="v out tnum">'+corto(r.gas)+'</div></div>'+
        '<div><div class="k">Guardou</div><div class="v save tnum">'+corto(r.aho)+'</div></div>'+
      '</div>'+

      (tieneSaldo
        ? '<div class="s12 faint mt12">É o saldo com que você começou, mais tudo o que anotou '+
          'desde então. Estes três números são só o que se moveu em '+
          MESES[d.getMonth()]+'.</div>'

  /* ritmo diario */
  var dias=diasEnMes(ym), hoyD=d.getDate(), restan=Math.max(1,dias-hoyD+1);
  var libre = muestra - pv.porPagar;          /* lo comprometido no es gastable */
  var porDia = libre>0 ? libre/restan : 0;
  /* el mismo cálculo, pero contando lo que todavía espera recibir */
  var libreC = muestra + pv.porEntrar - pv.porPagar;
  var porDiaC = libreC>0 ? libreC/restan : 0;
  /* cuándo llega lo que falta: no puede gastar hoy el sueldo del 30 */
  var ultC = pv.pendC && pv.pendC.length
    ? pv.pendC.slice().sort(function(a,b){ return b.fecha.localeCompare(a.fecha); })[0] : null;
  var cuandoC = ultC ? (ultC.dias<=0 ? 'já' : 'dia '+ultC.dia) : '';

  var extra='';
  if(pv.porEntrar>0 && porDiaC>porDia){
    extra = libre<=0
      ? '<div class="s13 mt8" style="color:var(--in)">Com o que você tem hoje não dá. '+
        'Quando entrarem os <b>'+money(pv.porEntrar)+'</b> que você espera'+(cuandoC?' ('+cuandoC+')':'')+
        ', seriam <b>'+money(porDiaC)+' por dia</b>.</div>'
      : '<div class="s13 mt8" style="color:var(--in)">Contando os <b>'+money(pv.porEntrar)+
        '</b> que ainda esperam entrar'+(cuandoC?' ('+cuandoC+')':'')+', seriam <b>'+money(porDiaC)+
        ' por dia</b>. Enquanto não caírem, o seu número é o de cima.</div>';
  }

  document.getElementById('paceBox').innerHTML =
    '<div class="card">'+
      '<h3>Seu ritmo</h3>'+
      (tieneSaldo || r.ing>0 || r.gas>0   /* con saldo ya se puede calcular, aunque no haya movimientos */
        ? '<div class="pace"><b class="tnum">'+money(porDia)+'</b><span class="muted s13">por dia, '+restan+' dia'+(restan>1?'s':'')+' até o fim do mês</span></div>'+
          (libre<=0
            ? '<div class="s13 muted mt8">'+(muestra<=0
                ? 'Você está no vermelho: o ideal é não gastar mais nada que não seja essencial e rever o plano.'
                : 'Com o que sobrou você não cobre as contas com data, então não há nada livre para gastar.')+'</div>'
            : (pv.porPagar>0
                ? '<div class="s13 muted mt8">É o que dá para gastar livre: já descontamos os <b>'+money(pv.porPagar)+'</b> de contas que faltam pagar.</div>'
                : ''))+
          extra
        : '<div class="s13 muted">Me diga quanto você tem hoje, ou registre seu primeiro movimento no botão <b>+</b>, para ver o seu ritmo.</div>')+
    '</div>';

  var pr=progreso();

    '<div class="card">'+
      '<h3>Seu próximo passo</h3>'+

        : '')+

        ? '<div class="banner ok mt12"><span class="e">💚</span><div>Este mês você poderia guardar <b>'+money(p.sugerido)+'</b>'+

          '</div></div>'
        : '')+
      '<button class="btn ghost sm mt12" style="width:100%" onclick="ir(\'plan\')">Ver o plano inteiro</button>'+
    '</div>';

  /* últimos movimientos */

/* los primeros pasos: mientras no los complete, el Inicio se mantiene simple
   y las tarjetas avanzadas ni aparecen */
function progreso(){
  if(S.ajustes.yaEmpezo) return {listo:true};
  var p={
    saldo:   !!S.perfil.saldoDesde,
    gasto:   S.mov.some(function(m){ return m.tipo==='out'; }),
    ingreso: S.mov.some(function(m){ return m.tipo==='in'; })
  };
  p.listo = p.saldo && p.gasto && p.ingreso;
  if(p.listo){ S.ajustes.yaEmpezo=true; }   /* una vez completo, no vuelve */
  return p;
}

function pintarAvisos(){
  var out='', a=S.ajustes;
  /* uno a la vez, por urgencia: cuatro avisos rojos juntos no se leen, se ignoran.
     Orden: no se guardan los datos > pago vencido > gasta mas de lo que gana > respaldo */
  var pv=prevision(), p=plan();
  if(!STORAGE_OK){
    out += '<div class="banner bad"><span class="e">\u26d4</span><div><b>Este navegador n\u00e3o est\u00e1 salvando seus dados.</b> '+
      'O que voc\u00ea registrar some ao fechar o app. Antes de fechar, v\u00e1 em <b>Mais</b> e baixe '+
      '\u00abMy Wallet com meus dados\u00bb \u2014 esse arquivo guarda tudo.'+
      '<button onclick="ir(\'mas\')">Ir para o backup \u2192</button></div></div>';
  }
  var dias = a.ultimoRespaldo ? Math.floor((Date.now()-new Date(a.ultimoRespaldo))/86400000) : null;
  if(!out && !pv.vencidos.length && !p.rescate &&
     S.mov.length>=5 && (dias===null || dias>=14 || a.movsDesdeRespaldo>=40)){
    out += '<div class="banner warn"><span class="e">🛟</span><div><b>Faça uma cópia dos seus dados.</b> '+
      (dias===null?'Você ainda não fez nenhuma.':'A última foi há '+dias+' dias.')+
      ' Se os dados do navegador forem apagados, perde tudo.'+
      '<button onclick="ir(\'mas\');setTimeout(function(){document.getElementById(\'respBox\').scrollIntoView({behavior:\'smooth\'})},250)">Fazer backup agora →</button></div></div>';
  }
  if(!out && pv.vencidos.length){
    out += '<div class="banner bad"><span class="e">\u23f0</span><div><b>'+
      (pv.vencidos.length===1 ? 'Venceu uma conta: '+esc(pv.vencidos[0].nombre)+' ('+money(pv.vencidos[0].monto)+').'
                              : 'Venceram '+pv.vencidos.length+' contas.')+
      '</b> Se você já pagou, registre para as contas baterem.</div></div>';
  }
  if(!out && p.rescate){
    out += '<div class="banner bad"><span class="e">⚠️</span><div><b>Você está gastando '+money(p.rescate.hueco)+' a mais do que ganha por mês.</b> '+
      'Antes de pensar em guardar, é preciso fechar esse buraco. Veja o seu plano.</div></div>';
  }
  document.getElementById('avisos').innerHTML=out;
}

/* meses que faltan para esa fecha, contando el mes en curso como 1 */
function mesesHasta(fecha){
  if(!fecha) return null;
  var hoy=new Date(), y=+fecha.slice(0,4), m=+fecha.slice(5,7), d=+fecha.slice(8,10);
  var n=(y-hoy.getFullYear())*12 + (m-(hoy.getMonth()+1));
  if(d>=hoy.getDate()) n+=1;          /* si el día todavía no llegó, ese mes cuenta */
  return n;
}
function metaFechaTxt(fecha){
  var p=fecha.split('-');
  return (+p[2])+' de '+MESES[+p[1]-1]+(p[0]!==String(new Date().getFullYear())?' de '+p[0]:'');
}

function metasCardHTML(p){
  return '<div class="card"><div class="row"><h3 style="margin:0">Minhas metas</h3>'+
    '<button class="chip" onclick="editarMeta()">+ Nova</button></div>'+
    (S.metas.length ? S.metas.map(function(g){
      var ah=ahorradoMeta(g.id), pc=g.objetivo?Math.min(100,ah/g.objetivo*100):0;
      var falta=Math.max(0,g.objetivo-ah);
      var porMes = p.sugerido>0 ? p.sugerido : 0;
      var eta = (falta>0 && porMes>0) ? Math.ceil(falta/porMes) : 0;
      /* con fecha, la meta deja de ser «algún día» y se puede hacer la cuenta */
      var mf = g.fecha ? mesesHasta(g.fecha) : null;
      var nota='';
      if(g.fecha && falta>0){
        if(mf<=0){
          nota='<div class="s12 mt8" style="color:var(--out)">A data já passou ('+
               metaFechaTxt(g.fecha)+') e ainda faltam <b>'+money(falta)+'</b>. '+
               'Toque para mudar a data ou baixar o valor.</div>';
        }else{
          var necesita=Math.ceil(falta/mf);
          var alcanza = porMes>0 && porMes>=necesita;
          nota='<div class="s12 mt8" style="color:var('+(alcanza?'--accent':'--warn')+')">'+
               'Para chegar '+(mf===1?'este mês':'em '+mf+' meses')+' ('+metaFechaTxt(g.fecha)+') '+
               'você precisa de <b>'+money(necesita)+' por mês</b>.'+
               (porMes>0
                 ? (alcanza
                     ? ' No ritmo que você leva, chega.'
                     : ' No ritmo que você leva ('+money(porMes)+' por mês) chegaria em '+
                       eta+' mes'+(eta>1?'es':'')+'.')
                 : '')+'</div>';
        }
      }
      return '<div class="goal" onclick="editarMeta(\''+g.id+'\')">'+
        '<div class="hd"><span class="e">'+(g.emoji||'🎯')+'</span><span class="nm">'+esc(g.nombre)+' <span class="ed">›</span></span>'+
        '<span class="pc tnum">'+Math.round(pc)+'%</span></div>'+
        '<div class="bar"><i class="c" style="width:'+pc+'%"></i></div>'+
        '<div class="ft"><span class="tnum">'+money(ah)+' de '+money(g.objetivo)+'</span>'+
        '<span>'+(falta<=0?'Conquistada! 🐾'
                 :(g.fecha && mf>0 ? metaFechaTxt(g.fecha)
                 :(eta?'≈ '+eta+(eta>1?' meses':' mês'):'Faltam '+money(falta))))+'</span></div>'+
        nota+
      '</div>'; }).join('')
      : '<div class="s13 muted mt8">Guardar «por guardar» quase nunca funciona. Dê um nome: uma viagem, um notebook, a entrada do apê, a troca de carro.</div>')+
  '</div>';
}

function mesAnterior(ym){
  var p=ym.split('-'), d=new Date(+p[0], +p[1]-2, 1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}
/* cuanto llevaba acumulado a esa altura del mes */
function hastaDia(ym, dia, tipo){
  var t=0;
  S.mov.forEach(function(m){
    if(m.fecha.slice(0,7)!==ym) return;
    if(+m.fecha.slice(8,10)>dia) return;
    if(m.tipo===tipo) t+=m.monto;
  });
  return t;
}

function filaComp(nombre, act, ant, menosEsMejor){
  var dif=act-ant;
  var pct = ant>0 ? Math.round(Math.abs(dif)/ant*100) : null;
  var bueno = menosEsMejor ? dif<0 : dif>0;
  var col = (dif===0 || ant===0) ? 'var(--muted)' : (bueno?'var(--accent)':'var(--out)');
  var txt;
  if(ant===0) txt='no mês passado você não registrou nada';
  else if(dif===0) txt='igual ao mês passado';
  else txt=(dif>0?'↑ ':'↓ ')+money(Math.abs(dif))+(pct!==null?' ('+pct+'%)':'')+(dif>0?' a mais':' a menos');
  return '<div class="row" style="padding:9px 0">'+
    '<div style="min-width:0"><div style="font-weight:600;font-size:14.5px">'+nombre+'</div>'+
    '<div class="s12" style="color:'+col+';font-weight:650;margin-top:2px">'+txt+'</div></div>'+
    '<div style="text-align:right;flex:none"><div class="tnum" style="font-weight:680;font-size:16px">'+money(act)+'</div>'+
    '<div class="s12 faint tnum">antes '+money(ant)+'</div></div></div>';
}

function comparativoHTML(ym){
  var prev=mesAnterior(ym), rp=resumen(prev);
  if(rp.ing===0 && rp.gas===0) return '';        /* sin mes anterior no hay comparación */
  var esActual=(ym===ymHoy());
  var dia = esActual ? new Date().getDate() : diasEnMes(ym);
  var diaPrev = Math.min(dia, diasEnMes(prev));
  var gA=hastaDia(ym,dia,'out'),  gB=hastaDia(prev,diaPrev,'out');
  var iA=hastaDia(ym,dia,'in'),   iB=hastaDia(prev,diaPrev,'in');
  var nomPrev=MESES[+prev.split('-')[1]-1];
  return '<div class="card"><h3>Comparado com '+nomPrev+'</h3>'+
    '<div class="s12 faint" style="margin-bottom:2px">'+
      (esActual
        ? 'Até hoje (dia '+dia+') contra os primeiros '+diaPrev+' dias de '+nomPrev+'. '+
          'É assim que se comparam períodos iguais.'
        : 'Mês inteiro contra mês inteiro.')+'</div>'+
    filaComp('Gastos', gA, gB, true)+
    filaComp('Entradas', iA, iB, false)+
  '</div>';
}

function trendHTML(){
  var ms=mesesConDatos().slice(-6);
  if(ms.length<2) return '';
  var datos=ms.map(function(m){ var r=resumen(m); return {m:m, ing:r.ing, gas:r.gas+r.aho}; });
  var max=Math.max.apply(null, datos.map(function(d){ return Math.max(d.ing,d.gas); }))||1;
  return '<div class="card"><h3>Últimos meses</h3><div class="trend">'+
    datos.map(function(d){
      return '<div class="col"><div class="b2" style="height:'+(d.ing/max*100)+'%"></div>'+
             '<div class="b1" style="height:'+(d.gas/max*100)+'%"></div></div>'; }).join('')+
    '</div><div class="trendlbl">'+datos.map(function(d){
      return '<div>'+MES_C[+d.m.split('-')[1]-1]+'</div>'; }).join('')+'</div>'+
    '<div class="s12 faint mt8">Barra clara em cima = o que entrou · Barra rosada embaixo = o que saiu</div></div>';
}

function abrirMes(){
  var ms=mesesConDatos(); if(ms.indexOf(ymHoy())<0) ms.push(ymHoy());
  var hy=new Date(), sig=new Date(hy.getFullYear(), hy.getMonth()+1, 1);
  var ymSig=sig.getFullYear()+'-'+pad(sig.getMonth()+1);
  if(ms.indexOf(ymSig)<0) ms.push(ymSig);
  ms.sort().reverse();
  sheet('Escolha o mês',
    ms.map(function(m){
      return '<button class="btn '+(m===VISTA.mes?'soft':'ghost')+'" style="margin-bottom:8px" '+
        'onclick="VISTA.mes=\''+m+'\';cerrarSheet();pintarMov()">'+nomMes(m)+'</button>'; }).join(''));
}

    }).join('')+'</div>';

  if(tab==='metas'){
    out += colchonCardHTML(p, true, true) + metasCardHTML(p);
  } else if(tab==='deudas'){
    out += deudasHTML();
  } else if(tab==='cuentas'){
    out += fijosCardHTML();
  } else if(tab==='cobrar'){
    out += cobrosCardHTML();
  } else {
  /* sin ingreso no se puede calcular el plan, pero lo que ella ya registro
     tiene que seguir a la vista: si no, no lo puede corregir ni borrar */
  var sinIngreso = b.ing<=0;
  if(sinIngreso){
    out += '<div class="card center"><div class="pxstage">'+pxa('idle',1)+'</div>'+
      '<div style="font-weight:660;font-size:15.5px;margin-top:6px">Preciso saber quanto entra</div>'+
      '<div class="s13 muted mt8">Registre suas entradas do mês no botão <b>+</b>, ou me diga quanto '+
      'você espera ganhar por mês. Sem isso não dá para calcular quanto guardar.</div>'+
      '<button class="btn soft mt16" onclick="editarPerfil()">Dizer quanto ganho por mês</button></div>';
  }

  if(!sinIngreso){

  /* rescate */
  if(p.rescate){
    out += '<div class="card" style="border-color:var(--out)">'+
      '<div class="row" style="align-items:flex-start">'+
        '<h3 style="color:var(--out);margin:0">Primeiro: fechar o buraco</h3>'+
        ''+pxa('sad',1)+''+
      '</div>'+
      '<div class="s14">Todo mês você gasta <b style="color:var(--out)">'+money(p.rescate.hueco)+'</b> a mais do que ganha. '+
      'Guardar é impossível enquanto isso durar — a meta deste mês não é poupar, é chegar a zero.</div>'+
      (p.rescate.top.length
        ? '<div class="mt12 s13 muted">Onde dá para cortar mais rápido:</div>'+
          p.rescate.top.map(function(x){
            return '<div class="row mt8 s14"><span>'+x.c.e+' '+esc(x.c.n)+'</span><b class="tnum" style="color:var(--out)">'+money(x.v)+'</b></div>';
          }).join('')
        : '')+
      '</div>';
  }

  /* cuánto guardar */
  var pctReal = b.ing>0 ? p.sugerido/b.ing*100 : 0;
  out += '<div class="card">'+
    '<h3>Quanto guardar por mês</h3>'+
    '<div style="font-size:33px;font-weight:700;letter-spacing:-.03em" class="tnum">'+money(p.sugerido)+'</div>'+
    '<div class="s13 muted mt8">'+
      (p.sugerido<=0
        ? 'Com os seus números de agora não sobra nada. Não é fracasso: é informação. Comece cortando o que não é essencial.'
        : (p.sugerido < p.ideal
            ? 'Sua meta é '+S.ajustes.metaAhorroPct+'% ('+money(p.ideal)+'), mas com os gastos de hoje o realista é '+
              Math.round(pctReal)+'%. Melhor guardar '+money(p.sugerido)+' todo mês do que prometer '+money(p.ideal)+' e não cumprir.'
            : 'É '+S.ajustes.metaAhorroPct+'% do que você ganha. Separe assim que o dinheiro cair, não no fim do mês.'))+
    '</div>'+
    '<div class="mt16" style="border-top:1px solid var(--line);padding-top:12px">'+
      '<div class="kv"><span>Entra por mês'+(b.estimado?' <span class="faint">(estimado)</span>':'')+'</span><b class="tnum">'+money(b.ing)+'</b></div>'+
      '<div class="kv"><span>Gastos indispensáveis</span><b class="tnum">'+money(b.ess)+'</b></div>'+
      '<div class="kv"><span>Extras e supérfluos</span><b class="tnum">'+money(b.noEss)+'</b></div>'+
      '<div class="kv big"><span>Sobra</span><b class="tnum" '+(p.disponible<0?'style="color:var(--out)"':'')+'>'+moneyS(p.disponible)+'</b></div>'+
    '</div>'+
    (b.meses>0 ? '<div class="s12 faint mt8">'+(b.meses>1?'Média dos seus últimos '+b.meses+' meses.':'Média do seu último mês.')+'</div>'
               : '<div class="s12 faint mt8">Com mais meses registrados, estes números ficam bem mais precisos.</div>')+
  '</div>';

  /* 50/30/20 */
  var t=b.ess+b.noEss+p.sugerido;
  if(t>0){
    var a1=b.ess/b.ing*100, a2=b.noEss/b.ing*100, a3=p.sugerido/b.ing*100;
    /* si ella guarda A%, lo que queda (100-A) se parte 5:3, igual que 50:30 */
    var aPct=S.ajustes.metaAhorroPct;
    var idNec=(100-aPct)*5/8, idGus=(100-aPct)*3/8;
    out += '<div class="card"><h3>Como seu dinheiro se divide</h3>'+
      '<div class="bar" style="height:13px"><i class="a" style="width:'+Math.min(100,a1)+'%"></i>'+
      '<i style="background:var(--warn);width:'+Math.min(100,a2)+'%"></i>'+
      '<i class="b" style="width:'+Math.min(100,a3)+'%"></i></div>'+
      '<div class="mt12">'+
        cmpRow('Indispensável', a1, idNec, 'var(--accent)', false)+
        cmpRow('Extras', a2, idGus, 'var(--warn)', false)+
        cmpRow('Guardado', a3, aPct, 'var(--save)', true)+
      '</div>'+
      '<div class="s12 faint mt8">'+
      (aPct===20
        ? 'É a referência clássica 50 / 30 / 20.'
        : 'Como sua meta de poupança é '+aPct+'%, o resto se divide '+Math.round(idNec)+' / '+Math.round(idGus)+
          ', na mesma proporção da referência clássica (50 / 30 / 20).')+
      ' É um guia, não uma regra: em São Paulo ou no Rio o aluguel sozinho já passa dos 50%.</div></div>';
  }

  /* escalera */
  out += '<div class="card"><h3>A ordem importa</h3>'+
    p.pasos.map(function(s,i){
      return '<div class="step '+s.estado+'"><div class="n">'+(s.estado==='done'?'✓':(i+1))+'</div><div>'+
        '<div class="ti">'+esc(s.t)+'</div><div class="de">'+esc(s.d)+'</div>'+
        (s.meta>0 && s.estado!=='done' ? '<div class="pill">Faltam '+money(Math.max(0,s.meta-s.act))+'</div>' : '')+
        (s.estado==='done' ? '<div class="pill" style="background:var(--accent-soft);color:var(--accent-ink)">Feito ✓</div>' : '')+
      '</div></div>'; }).join('')+
  '</div>';
  } /* fin de lo que depende del ingreso */

  /* ajuste de meta */
  out += '<div class="card flat"><h3>Ajustar meu plano</h3>'+
    '<label class="f">Quero guardar esta % do que ganho</label>'+
    '<input class="f" type="number" min="1" max="80" value="'+S.ajustes.metaAhorroPct+'" '+
      'onchange="S.ajustes.metaAhorroPct=Math.max(1,Math.min(80,+this.value||20));pintarTodo()">'+
    '<label class="f">Quero uma reserva de quantos meses</label>'+
    '<select class="f" onchange="S.ajustes.colchonMeses=+this.value;pintarTodo()">'+
      [1,2,3,4,5,6].map(function(m){ return '<option value="'+m+'"'+(S.ajustes.colchonMeses===m?' selected':'')+'>'+m+(m>1?' meses':' mês')+'</option>'; }).join('')+
    '</select>'+
    '<button class="btn ghost mt16" onclick="editarPerfil()">Mudar minha renda esperada</button>'+
  '</div>';
  }

  document.getElementById('planBox').innerHTML=out;
}
/* masEsMejor: en ahorro pasarse es bueno; en gastos, no */
function cmpRow(nm, real, ideal, col, masEsMejor){
  var d=real-ideal, cl='var(--text)';
  if(Math.abs(d)>=3) cl = (masEsMejor ? (d>0) : (d<0)) ? 'var(--accent)' : 'var(--out)';
  return '<div class="row s13" style="padding:7px 0">'+
    '<span><b style="color:'+col+'">■</b> '+nm+'</span>'+
    '<span class="tnum"><b style="color:'+cl+'">'+Math.round(real)+'%</b>'+
    ' <span class="faint">· ideal '+Math.round(ideal)+'%</span></span></div>';
}

function opcion(e,nm,riesgo,plazo,txt,filas){
  var tag = riesgo==='low'?'Risco baixo':(riesgo==='mid'?'Risco médio':'Risco alto');
  return '<div class="opt"><div class="hd"><span class="e">'+e+'</span><span class="nm">'+nm+'</span>'+
    '<span class="tag '+riesgo+'">'+tag+'</span></div>'+
    '<p>'+txt+'</p><dl>'+filas.map(function(f){
      return '<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>'; }).join('')+'</dl></div>';
}

/* o que se ve dentro de um campo de valor: 1.234,56 */
function fmtNum(c){
  var v=Math.round(Math.abs(c||0));
  return (v/100).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
/* le o campo de volta em centavos: so os digitos importam */
function unfmt(s){ return +String(s).replace(/[^\d]/g,'')||0; }
function fmtIn(el){
  var v=unfmt(el.value); var pos=el.value.length-el.selectionStart;
  el.value = v?fmtNum(v):'';
  try{ el.selectionStart=el.selectionEnd=Math.max(0,el.value.length-pos); }catch(e){}
}
function num(id){ var e=document.getElementById(id); return e?+String(e.value).replace(',','.').replace(/\.(?=\d{3}\b)/g,'')||0:0; }

function calc1(){
  var m=unfmt((document.getElementById('c1m')||{}).value||0);
  var t=+String((document.getElementById('c1t')||{}).value||0).replace(',','.')||0;
  var p=+String((document.getElementById('c1p')||{}).value||0).replace(/[^\d]/g,'')||0;
  S._c1m=(document.getElementById('c1m')||{}).value; S._c1t=(document.getElementById('c1t')||{}).value; S._c1p=(document.getElementById('c1p')||{}).value;
  var el=document.getElementById('c1out'); if(!el) return;
  if(!m||!p){ el.innerHTML='<div class="s13 faint">Preencha os campos para ver o resultado.</div>'; return; }
  var fin = m*Math.pow(1+t/100, p/12);
  var gana = fin-m;
  var infl = m*Math.pow(1+S.ajustes.inflacion/100, p/12);
  var real = fin-infl;
  el.innerHTML =
    '<div class="kv"><span>No fim você teria</span><b class="tnum">'+money(fin)+'</b></div>'+
    '<div class="kv"><span>Rendimento</span><b class="tnum" style="color:var(--accent)">+'+money(gana)+'</b></div>'+
    '<div class="kv big"><span>Ganho real<br><span class="s12 faint" style="font-weight:400">descontando a inflação</span></span>'+
      '<b class="tnum" style="color:'+(real>=0?'var(--accent)':'var(--out)')+'">'+(real>=0?'+':'−')+money(real)+'</b></div>'+
    '<div class="s12 faint mt8">'+(real>=0
      ? 'Seu dinheiro cresce mais rápido do que os preços sobem. Bom.'
      : 'Nessa taxa você perde poder de compra: os preços sobem mais rápido. Busque pelo menos '+Math.ceil(S.ajustes.inflacion)+'% ao ano.')+
    '</div>'+
    '<div class="s12 faint mt8">É o valor bruto. Em CDB e Tesouro ainda sai o IR — veja a calculadora de baixo.</div>';
}
function calc2(){
  var m=unfmt((document.getElementById('c2m')||{}).value||0);
  var t=+String((document.getElementById('c2t')||{}).value||0).replace(',','.')||0;
  var a=+String((document.getElementById('c2a')||{}).value||0).replace(/[^\d]/g,'')||0;
  S._c2m=(document.getElementById('c2m')||{}).value; S._c2t=(document.getElementById('c2t')||{}).value; S._c2a=(document.getElementById('c2a')||{}).value;
  var el=document.getElementById('c2out'); if(!el) return;
  if(!m||!a){ el.innerHTML='<div class="s13 faint">Preencha os campos para ver o resultado.</div>'; return; }
  var n=a*12, i=Math.pow(1+t/100,1/12)-1;
  var fin = i>0 ? m*((Math.pow(1+i,n)-1)/i) : m*n;
  var puesto=m*n;
  el.innerHTML =
    '<div class="kv"><span>Você vai pôr no total</span><b class="tnum">'+money(puesto)+'</b></div>'+
    '<div class="kv"><span>Juros ganhos</span><b class="tnum" style="color:var(--accent)">+'+money(fin-puesto)+'</b></div>'+
    '<div class="kv big"><span>Teria em '+a+' ano'+(a>1?'s':'')+'</span><b class="tnum">'+money(fin)+'</b></div>'+
    '<div class="s12 faint mt8">'+money(m)+' por mês parece pouco, mas '+money(fin)+' em '+a+' ano'+(a>1?'s':'')+' não é.</div>';

/* IR regressivo da renda fixa, pela quantidade de dias aplicados */
function aliquotaIR(dias){
  if(dias<=180) return 22.5;
  if(dias<=360) return 20;
  if(dias<=720) return 17.5;
  return 15;
}
/* IOF dos 30 primeiros dias: come de 96% do rendimento no dia 1 a 0% no dia 30 */
function aliquotaIOF(dias){
  if(dias>=30) return 0;
  return Math.max(0, Math.round((30-dias)/30*100));
}
function calc3(){
  var m=unfmt((document.getElementById('c3m')||{}).value||0);
  var t=+String((document.getElementById('c3t')||{}).value||0).replace(',','.')||0;
  var d=+String((document.getElementById('c3d')||{}).value||0).replace(/[^\d]/g,'')||0;
  S._c3m=(document.getElementById('c3m')||{}).value;
  S._c3t=(document.getElementById('c3t')||{}).value;
  S._c3d=(document.getElementById('c3d')||{}).value;
  var el=document.getElementById('c3out'); if(!el) return;
  if(!m||!d){ el.innerHTML='<div class="s13 faint">Preencha os campos para ver o resultado.</div>'; return; }

  var bruto = m*Math.pow(1+t/100, d/365) - m;
  var pIOF = aliquotaIOF(d), iof = bruto*pIOF/100;
  var pIR = aliquotaIR(d),  ir  = (bruto-iof)*pIR/100;
  var liq = bruto - iof - ir;
  /* a taxa que uma LCI/LCA isenta precisaria pagar para empatar com isto */
  var equiv = t>0 ? t*(liq/bruto) : 0;

  el.innerHTML =
    '<div class="kv"><span>Rendimento bruto</span><b class="tnum">'+money(bruto)+'</b></div>'+
    (pIOF>0 ? '<div class="kv"><span>IOF ('+pIOF+'% — saque antes de 30 dias)</span><b class="tnum" style="color:var(--out)">−'+money(iof)+'</b></div>' : '')+
    '<div class="kv"><span>IR ('+String(pIR).replace('.',',')+'%)</span><b class="tnum" style="color:var(--out)">−'+money(ir)+'</b></div>'+
    '<div class="kv big"><span>Sobra no bolso</span><b class="tnum" style="color:var(--accent)">'+money(liq)+'</b></div>'+
    '<div class="kv"><span>No fim você teria</span><b class="tnum">'+money(m+liq)+'</b></div>'+
    '<div class="s12 faint mt8">Uma <b>LCI ou LCA isenta</b> pagando <b>'+equiv.toFixed(2).replace('.',',')+'% ao ano</b> '+
    'te deixaria com o mesmo dinheiro. Se te oferecerem menos que isso, o CDB tributado ganha.</div>'+
    (pIOF>0
      ? '<div class="s12 mt8" style="color:var(--out)">Sacando antes de 30 dias o IOF leva '+pIOF+'% do rendimento. Esperar até o dia 30 já resolve isso.</div>'
      : (d<=180
          ? '<div class="s12 mt8" style="color:var(--warn)">Até 180 dias o IR é o maior: 22,5%. Passando de 2 anos cai para 15%.</div>'
          : ''));
}

/* =========================================================================
   LEMBRETES (push)

   O servidor so manda um toque no ombro, sem conteudo. Quem escreve a
   notificacao e o service worker, lendo o que esta gravado aqui dentro.
   O servidor guarda o endereco de push deste aparelho e mais nada.
   ========================================================================= */

/* Preencha os tres depois de publicar o servidor. Os mesmos valores
   precisam ir para o site/sw.js. Enquanto estiverem vazios, o card
   explica que falta configurar e nao tenta nada. */
var PUSH_SERVIDOR = '';
var PUSH_CHAVE = '';
var PUSH_TOKEN = '';

var LEMB = { estado:'?', hora:20, erro:'' };

function pushConfigurado(){ return !!(PUSH_SERVIDOR && PUSH_CHAVE); }
function pushSuportado(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
/* no iPhone, push so existe com o app na tela de inicio */
function ehIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||''); }
function naTelaDeInicio(){
  if(navigator.standalone===true) return true;
  try{ return window.matchMedia('(display-mode: standalone)').matches; }catch(e){ return false; }
}

function b64paraBytes(b64){
  var t=(b64+'='.repeat((4-b64.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');
  var bin=atob(t), u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function fuso(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Sao_Paulo'; }
  catch(e){ return 'America/Sao_Paulo'; }
}
function pushPost(rota, corpo){
  return fetch(PUSH_SERVIDOR+rota, {
    method:'POST', headers:{'content-type':'application/json'},
    body:JSON.stringify(Object.assign({token:PUSH_TOKEN}, corpo))
  }).then(function(r){ return r.json().catch(function(){ return {}; }); });
}

/* descobre em que pe esta, sem pedir permissao nenhuma */
function lembEstado(){
  LEMB.erro='';
  if(!pushConfigurado()) { LEMB.estado='semservidor'; return Promise.resolve(); }
  if(!pushSuportado())   { LEMB.estado='semsuporte';  return Promise.resolve(); }
  if(ehIOS() && !naTelaDeInicio()){ LEMB.estado='semhome'; return Promise.resolve(); }
  if(Notification.permission==='denied'){ LEMB.estado='bloqueado'; return Promise.resolve(); }
  return navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    LEMB.estado = sub ? 'ativo' : 'desligado';
  }).catch(function(){ LEMB.estado='desligado'; });
}

/* tem que ser chamado direto do toque: no iOS, pedir permissao fora de
   um gesto do usuario falha sem dizer nada */
function lembAtivar(){
  if(!pushConfigurado() || !pushSuportado()) return;
  var antes=LEMB.estado;
  LEMB.estado='indo'; pintarMas();

  Notification.requestPermission().then(function(p){
    if(p!=='granted'){
      LEMB.estado = (p==='denied' ? 'bloqueado' : antes);
      pintarMas();
      return;
    }
    return navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(j){
        return j || reg.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:b64paraBytes(PUSH_CHAVE)
        });
      });
    }).then(function(sub){
      return pushPost('/inscrever', {
        sub:sub.toJSON(), fuso:fuso(), hora:LEMB.hora, quem:'rafael'
      });
    }).then(function(r){
      if(r && r.ok){ LEMB.estado='ativo'; toast('Lembretes ligados ✓'); }
      else { LEMB.estado='desligado'; LEMB.erro=(r&&r.erro)||'servidor'; toast('Não deu para ligar'); }
      pintarMas();
    });
  }).catch(function(e){
    LEMB.estado='desligado'; LEMB.erro=String(e&&e.message||e).slice(0,80);
    pintarMas(); toast('Não deu para ligar');
  });
}

function lembDesligar(){
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    if(!sub) return;
    var ep=sub.endpoint;
    return sub.unsubscribe().then(function(){ return pushPost('/desinscrever',{endpoint:ep}); });
  }).then(function(){
    LEMB.estado='desligado'; pintarMas(); toast('Lembretes desligados');
  }).catch(function(){ toast('Não deu para desligar'); });
}

/* o teste passa pelo mesmo caminho do lembrete de verdade: push vazio,
   texto montado aqui dentro. Se chegar, o caminho inteiro funciona. */
function lembTestar(){
  toast('Mandando…');
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    if(!sub){ toast('Ligue os lembretes primeiro'); return; }
    return pushPost('/testar',{endpoint:sub.endpoint}).then(function(r){
      toast(r && r.ok ? 'Mandei. Deve chegar em segundos.' : 'O servidor recusou');
    });
  }).catch(function(){ toast('Não deu para mandar'); });
}

function lembHora(v){
  LEMB.hora=Math.max(0,Math.min(23,parseInt(v,10)||20));
  if(LEMB.estado!=='ativo') return;
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    if(sub) return pushPost('/inscrever',{sub:sub.toJSON(), fuso:fuso(), hora:LEMB.hora, quem:'rafael'});
  }).then(function(){ toast('Horário salvo ✓'); }).catch(function(){});
}
